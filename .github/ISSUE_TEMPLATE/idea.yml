name: Idea
description: Share an early idea you would like to discuss
title: "Idea: <short idea>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to share this. Before you post, please look at the [open requests](https://github.com/anis-marrouchi/agentx/issues?q=is%3Aissue+is%3Aopen+sort%3Areactions-%2B1-desc) and give a 👍 to the ones you care about. It is an invitation, not a requirement. [How voting works](https://agentx-docs.pages.dev/guides/contribute).
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: A few sentences are enough. It does not need to be fully worked out.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters to you
      description: The situation that made you think of it.
    validations:
      required: true
