name: Enhancement
description: Improve something AgentX already does
title: "Enh: <area> – <what gets better>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to share this. Before you post, please look at the [open requests](https://github.com/anis-marrouchi/agentx/issues?q=is%3Aissue+is%3Aopen+sort%3Areactions-%2B1-desc) and give a 👍 to the ones you care about. It is an invitation, not a requirement. [How voting works](https://agentx-docs.pages.dev/guides/contribute).
  - type: input
    id: area
    attributes:
      label: Which part of AgentX?
      description: For example the dashboard Settings page, a CLI command, a channel, or the phone app.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How it works today
      description: What you do now, and where it falls short.
    validations:
      required: true
  - type: textarea
    id: better
    attributes:
      label: How it could work
      description: What would be better, from your point of view as a user.
    validations:
      required: true
