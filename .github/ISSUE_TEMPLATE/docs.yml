name: Docs
description: Something in the documentation is missing, wrong, or hard to follow
title: "Docs: <page> – <what is missing or wrong>"
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to share this. Before you post, please look at the [open requests](https://github.com/anis-marrouchi/agentx/issues?q=is%3Aissue+is%3Aopen+sort%3Areactions-%2B1-desc) and give a 👍 to the ones you care about. It is an invitation, not a requirement. [How voting works](https://agentx-docs.pages.dev/guides/contribute).
  - type: input
    id: page
    attributes:
      label: Which page?
      description: A link to the page, or the topic if there is no page yet.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing, wrong, or unclear?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would have helped you?
      description: Optional. A better wording, a missing step, or a screenshot.
