name: Docs gate

# Keeps docs/ in step with the code (CONTRIBUTING.md › Docs gate).
# All paths and patterns live in scripts/docs-gate.config.json.
on:
  pull_request:
    # "edited", "labeled" and "unlabeled" re-run the gate when the PR body
    # or the no-docs-needed label changes.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: docs-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Rewrite git+ssh deps to https
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - run: pnpm install --frozen-lockfile

      # The surface is every CLI command, flag and config key. Reading it at
      # the base as well lets the gate spot removals the docs still mention.
      - name: Read the surface of this PR
        run: pnpm exec tsx scripts/docs-surface.mts > "$RUNNER_TEMP/head-surface.json"

      - name: Read the surface of the base branch
        continue-on-error: true
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/base/node_modules"
          cd "$RUNNER_TEMP/base"
          "$GITHUB_WORKSPACE/node_modules/.bin/tsx" "$GITHUB_WORKSPACE/scripts/docs-surface.mts" \
            --config "$GITHUB_WORKSPACE/scripts/docs-gate.config.json" > "$RUNNER_TEMP/base-surface.json"

      - name: Code changes come with docs
        if: ${{ !cancelled() }}
        env:
          # Passed through env, never inlined into the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: >-
          node scripts/docs-gate.mjs impact --base "$BASE_SHA" --head HEAD
          --base-surface "$RUNNER_TEMP/base-surface.json"
          --head-surface "$RUNNER_TEMP/head-surface.json"

      - name: Changed pages follow the docs rule
        if: ${{ !cancelled() }}
        env:
          DOCS_GATE_EXTRA_FORBIDDEN: ${{ secrets.DOCS_GATE_EXTRA_FORBIDDEN }}
        run: node scripts/docs-gate.mjs rules --base "$BASE_SHA" --head HEAD

      # Warning only (coverage.mode = "warn") until the docs audit is done.
      - name: Every command, flag and setting is documented
        if: ${{ !cancelled() }}
        run: node scripts/docs-gate.mjs coverage --surface "$RUNNER_TEMP/head-surface.json"
