name: CI

on:
  push:
    branches: [main, docs-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A real IMAP/SMTP server for test/email-roundtrip.test.ts (#1287).
    services:
      greenmail:
        image: greenmail/standalone:2.1.3
        ports: ["3025:3025", "3143:3143"]
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=support:secret@example.com,sam:secret@client.test
    env:
      EMAIL_TEST_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Rewrite git+ssh deps to https
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: node scripts/hub-name-check.mjs
      - run: pnpm test

      - run: pnpm build
      - run: node scripts/check-package.mjs
