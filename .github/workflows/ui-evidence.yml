name: UI evidence

# A PR that changes UI paths shows a screenshot or recording under
# "## Evidence" (CONTRIBUTING.md › UI evidence check). Paths and patterns
# live in scripts/ui-evidence.config.json.
#
# Repository variable QUALITY_UI_EVIDENCE_ENABLED (quality.uiEvidence.enabled),
# parsed by parseMode() in scripts/ui-evidence-lib.mjs:
#   unset or "advisory"      a missing screenshot posts a neutral ui-evidence check
#   "required"               a missing screenshot fails the check
#   "false", "off" or "0"    the check is posted as a success saying it is off
# The job always runs, so a required ui-evidence check is posted in every mode.
on:
  pull_request:
    # "edited", "labeled" and "unlabeled" re-run the check when the PR body
    # or the no-ui-evidence-needed label changes.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  # Posts the verdict as the "ui-evidence" check run (neutral in advisory mode).
  checks: write

# No concurrency group, as in the docs gate (#995): a cancelled run reads as
# neither pass nor fail. Every run reads the description and labels from the
# API when it starts, so the run that finishes last still posts a current
# verdict.

jobs:
  evidence:
    name: UI evidence job
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The scripts come from the base branch, so a PR cannot loosen the
      # check that judges it. Changed files come from the API.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: scripts
          persist-credentials: false

      # Bootstrap only: until the check is on the base branch, use the PR's.
      - if: ${{ hashFiles('scripts/ui-evidence.mjs') == '' }}
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: UI changes come with a screenshot or recording
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UI_EVIDENCE_MODE: ${{ vars.QUALITY_UI_EVIDENCE_ENABLED }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ui-evidence.mjs --pr "$PR_NUMBER" --post-check "$HEAD_SHA"
