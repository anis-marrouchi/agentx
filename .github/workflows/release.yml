name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish or retry (empty to update release PR)'
        required: false
        type: string

# One release at a time, per job and not for the whole run (#2227). With one
# group for the run, the next merge waited for the previous release's install
# check (8 to 11 minutes, most of it waiting for npm) before its release PR
# was even updated.

permissions:
  contents: read

jobs:
  version:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-version
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Select release baseline
        id: baseline
        # The initial tag predates its merge commit. Stop at that merge only
        # until the first automated release updates the manifest.
        run: |
          node -e 'const v=require("./.release-please-manifest.json")["."]; console.log(`config=${v === "0.28.0" ? ".github/release-please-initial.json" : "release-please-config.json"}`)' >> "$GITHUB_OUTPUT"
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: ${{ steps.baseline.outputs.config }}
          manifest-file: .release-please-manifest.json
      # Release Please writes every `Refs #N` footer as ", closes [#N]" in
      # the release PR body, so merging the release PR would close issues
      # that the fixes only referenced (#1731). Say "refs" instead; closing
      # an issue stays a separate decision.
      - name: Keep the release PR from closing issues
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          number=$(jq -r '.number' <<<"$PR_JSON")
          body=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          fixed=$(printf '%s' "$body" | sed -E 's/([ ,(])([Cc]loses|[Ff]ixes|[Rr]esolves) \[#/\1refs [#/g')
          if [ "$fixed" != "$body" ]; then
            printf '%s' "$fixed" | gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --body-file -
          fi

  publish:
    needs: version
    if: ${{ always() && (needs.version.outputs.released == 'true' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) && !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || needs.version.outputs.tag }}
          fetch-depth: 0
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.version.outputs.tag }}
        run: |
          node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG !== `v${p.version}`) throw Error("Tag and package version differ")'
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          pnpm install --frozen-lockfile
      # The release commit is the release PR squashed. When its files are
      # the same as the PR's last commit and CI passed there, the type check
      # and the tests have already run on exactly these files (#2227).
      - name: Were these files already tested?
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tested=false
          sha=$(git rev-parse HEAD)
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" -q '.[0].number' || true)
          if [ -n "$pr" ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" -q '.head.sha' || true)
            if [ -n "$head" ] && git fetch -q origin "pull/$pr/head" \
              && [ "$(git rev-parse "$head^{tree}")" = "$(git rev-parse "HEAD^{tree}")" ]; then
              passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&status=success" -q '.total_count' || echo 0)
              [ "${passed:-0}" -gt 0 ] && tested=true
            fi
          fi
          echo "PR #${pr:-none}, head ${head:-none}, tested=$tested"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - if: ${{ steps.tested.outputs.tested != 'true' }}
        run: pnpm typecheck
      - if: ${{ steps.tested.outputs.tested != 'true' }}
        run: pnpm test
      - run: pnpm docs:check
      - run: pnpm build
      - name: Check packed files
        run: node scripts/check-package.mjs
      - name: Enable npm trusted publishing
        run: |
          npm install -g npm@11.6.2
          npm --version
      - name: Publish to npm
        run: npm publish --access public --provenance --registry https://registry.npmjs.org

  # Install what was just published every supported way, and record the
  # pass rate the README shows (#1294). A failure here does not undo the
  # release; it shows on the badge and in the run.
  install-matrix:
    needs: [version, publish]
    if: ${{ always() && needs.publish.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/install-matrix.yml
    with:
      version: ${{ inputs.tag || needs.version.outputs.tag }}
