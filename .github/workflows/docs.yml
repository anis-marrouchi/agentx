name: Deploy docs

on:
  push:
    branches: [main, docs-v2]
    paths:
      - "docs/**"
      - "docs-holding/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-holding/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_DEPLOY_DIR: docs/.vitepress/dist
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # must satisfy engines (>=22 <23); engine-strict refuses otherwise
          cache: pnpm

      - name: Rewrite git+ssh deps to https
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm docs:check

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/.vitepress/dist
          retention-days: 7

      - name: Ensure Cloudflare Pages project exists
        if: ${{ vars.DEPLOY_TO_CLOUDFLARE == 'true' }}
        continue-on-error: true  # safe to ignore — it just means the project already exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages project create agentx-docs --production-branch=main

      - name: Set Cloudflare Pages production branch
        if: ${{ vars.DEPLOY_TO_CLOUDFLARE == 'true' && github.ref == 'refs/heads/main' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/pages/projects/agentx-docs`, {
            method: 'PATCH',
            headers: { Authorization: `Bearer ${process.env.CF_API_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ production_branch: 'main' }),
          });
          const body = await response.json();
          if (!response.ok || !body.success) throw new Error(`Could not update Pages production branch (HTTP ${response.status})`);
          console.log(`Production branch: ${body.result.production_branch}`);
          JS

      - name: Deploy to Cloudflare Pages
        if: ${{ vars.DEPLOY_TO_CLOUDFLARE == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: >-
            pages deploy ${{ env.DOCS_DEPLOY_DIR }}
            --project-name=agentx-docs
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-dirty=true
