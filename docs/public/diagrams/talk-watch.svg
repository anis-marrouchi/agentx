<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 880" width="920" height="880" role="img" aria-labelledby="t d" style="--cycle:4.9s">
<title id="t">How you talk to an agent on your watch</title>
<desc id="d">Seven steps in two parts. You start it: pair the watch with the phone as a headset, choose the agent once, then tap Talk to AgentX on the phone, or call the AgentX contact from the watch. Then the watch, the phone and the computer take turns: the watch rings and you answer on it, you speak after the beep, the phone sends the recording to your computer, which writes it down and asks the agent, and the answer is spoken on the watch. It goes on until you hang up on the watch. Hanging up while the agent works does not stop it: the answer is kept in the phone app's Chat.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B0D12" flood-opacity="0.07"/></filter></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B0D12; }
.h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.sub { font-size: 16px; fill: #475569; }
.legend { font-size: 14px; font-weight: 600; }
.band { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; fill: #1A66FF; }
.band.warn { fill: #B45309; }
.title { font-size: 17px; font-weight: 650; }
.note { font-size: 14px; fill: #475569; }
.rowname { font-size: 15px; font-weight: 600; }
.symptom { font-size: 15.5px; font-weight: 650; }
.state { font-size: 12.5px; font-weight: 600; }
.num { font-size: 14.5px; font-weight: 700; fill: #fff; }
.pill { font-size: 13px; font-weight: 700; fill: #fff; }
.wintitle { font-size: 13.5px; font-weight: 600; fill: #475569; }
.card { fill: #fff; stroke: #E2E8F0; stroke-width: 1.25; filter: url(#soft); }
.card.accent { stroke: #C7D9FF; }
.card.win { stroke: #0B0D12; stroke-width: 1.5; }
.link { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100; animation: draw 0.9s ease-in-out backwards; }
.rise { animation: rise 0.55s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade 0.4s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse var(--cycle) ease-out infinite; }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 9% { opacity: 0; transform: scale(1.9); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rise, .fade, .wrap, .pulse, .blink { animation: none; } }
</style>
<rect width="920" height="880" rx="24" fill="#FFFFFF"/>
<text x="44" y="56" class="h1" text-anchor="start">How you talk to an agent on your watch</text>
<text x="44" y="82" class="sub" text-anchor="start">The phone rings the watch, like a call. No phone call is made, no call cost.</text>
<circle cx="704" cy="50" r="7" fill="#1A66FF"/><text x="718" y="55" class="legend" text-anchor="start">You</text>
<circle cx="704" cy="74" r="7" fill="#0B0D12"/><text x="718" y="79" class="legend" text-anchor="start">Your phone and computer</text>
<rect x="20" y="104" width="880" height="200" rx="20" fill="#F3F7FF"/>
<text x="44" y="132" class="band" text-anchor="start">YOU START IT</text>
<g class="rise" style="animation-delay:0.32s">
<rect x="44" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:4.94s"/>
<circle cx="70" cy="176" r="15" fill="#1A66FF"/>
<text x="70" y="181" class="num" text-anchor="middle">1</text>
<text x="60" y="220" class="title" text-anchor="start">Pair the watch</text>
<text x="60" y="241" class="title" text-anchor="start">with the phone</text>
<text x="60" y="263" class="note" text-anchor="start">as a headset, as for</text>
<text x="60" y="280" class="note" text-anchor="start">phone calls</text>
</g>
<g class="rise" style="animation-delay:0.64s">
<rect x="328" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:5.64s"/>
<circle cx="354" cy="176" r="15" fill="#1A66FF"/>
<text x="354" y="181" class="num" text-anchor="middle">2</text>
<text x="344" y="220" class="title" text-anchor="start">Choose the agent</text>
<text x="344" y="242" class="note" text-anchor="start">once; the phone</text>
<text x="344" y="259" class="note" text-anchor="start">remembers it</text>
</g>
<g class="fade" style="animation-delay:0.47s"><path d="M311 216 H323" class="link"/><path d="M319 212 L324 216 L319 220" class="link"/></g>
<g class="rise" style="animation-delay:0.96s">
<rect x="612" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="638" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:6.34s"/>
<circle cx="638" cy="176" r="15" fill="#1A66FF"/>
<text x="638" y="181" class="num" text-anchor="middle">3</text>
<text x="628" y="220" class="title" text-anchor="start">Tap Talk to AgentX,</text>
<text x="628" y="241" class="title" text-anchor="start">or call it on the watch</text>
<text x="628" y="263" class="note" text-anchor="start">the AgentX contact;</text>
<text x="628" y="280" class="note" text-anchor="start">no phone call is made</text>
</g>
<g class="fade" style="animation-delay:0.79s"><path d="M595 216 H607" class="link"/><path d="M603 212 L608 216 L603 220" class="link"/></g>
<rect x="20" y="320" width="880" height="372" rx="20" fill="#F6F7F9"/>
<text x="92" y="348" class="band" text-anchor="start">THEN, ON THE WATCH, UNTIL YOU HANG UP</text>
<path d="M744 284 V302 Q744 312 734 312 H80 Q70 312 70 322 V360" class="wrap" pathLength="100" style="animation-delay:1.26s"/>
<path d="M65 355 L70 361 L75 355" class="link fade" style="animation-delay:2.16s"/>
<g class="rise" style="animation-delay:1.28s">
<rect x="44" y="364" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="392" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:7.04s"/>
<circle cx="70" cy="392" r="15" fill="#1A66FF"/>
<text x="70" y="397" class="num" text-anchor="middle">4</text>
<text x="60" y="436" class="title" text-anchor="start">The watch rings;</text>
<text x="60" y="457" class="title" text-anchor="start">you answer on it</text>
<text x="60" y="479" class="note" text-anchor="start">the call screen of</text>
<text x="60" y="496" class="note" text-anchor="start">the watch</text>
</g>
<g class="rise" style="animation-delay:1.60s">
<rect x="328" y="364" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="392" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:7.74s"/>
<circle cx="354" cy="392" r="15" fill="#1A66FF"/>
<text x="354" y="397" class="num" text-anchor="middle">5</text>
<text x="344" y="436" class="title" text-anchor="start">You speak after</text>
<text x="344" y="457" class="title" text-anchor="start">the beep</text>
<text x="344" y="479" class="note" text-anchor="start">a pause ends</text>
<text x="344" y="496" class="note" text-anchor="start">what you say</text>
</g>
<g class="fade" style="animation-delay:1.43s"><path d="M311 432 H323" class="link"/><path d="M319 428 L324 432 L319 436" class="link"/></g>
<g class="rise" style="animation-delay:1.92s">
<rect x="612" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="638" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:8.44s"/>
<circle cx="638" cy="392" r="15" fill="#0B0D12"/>
<text x="638" y="397" class="num" text-anchor="middle">6</text>
<text x="628" y="436" class="title" text-anchor="start">The computer writes</text>
<text x="628" y="457" class="title" text-anchor="start">it down, asks the agent</text>
<text x="628" y="479" class="note" text-anchor="start">the same chat as in</text>
<text x="628" y="496" class="note" text-anchor="start">the phone app</text>
</g>
<g class="fade" style="animation-delay:1.75s"><path d="M595 432 H607" class="link"/><path d="M603 428 L608 432 L603 436" class="link"/></g>
<path d="M744 500 V508 Q744 518 734 518 H80 Q70 518 70 528 V532" class="wrap" pathLength="100" style="animation-delay:2.22s"/>
<path d="M65 527 L70 533 L75 527" class="link fade" style="animation-delay:3.12s"/>
<g class="rise" style="animation-delay:2.24s">
<rect x="44" y="536" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="564" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:9.14s"/>
<circle cx="70" cy="564" r="15" fill="#0B0D12"/>
<text x="70" y="569" class="num" text-anchor="middle">7</text>
<text x="60" y="608" class="title" text-anchor="start">The answer is spoken</text>
<text x="60" y="629" class="title" text-anchor="start">on the watch</text>
<text x="60" y="651" class="note" text-anchor="start">then a beep: your turn</text>
<text x="60" y="668" class="note" text-anchor="start">again</text>
</g>
<g class="rise" style="animation-delay:2.64s"><rect x="328" y="570" width="264" height="68" rx="14" class="card"/><rect x="328" y="570" width="6" height="68" rx="3" fill="#DC2626"/><text x="350" y="599" class="title" text-anchor="start">You hang up mid-answer</text><text x="350" y="621" class="note" text-anchor="start">The answer is kept in Chat.</text></g>
<g class="rise" style="animation-delay:2.44s">
<rect x="612" y="524" width="264" height="160" rx="14" class="card win"/>
<path d="M612 558 H876" stroke="#E2E8F0"/>
<circle cx="630" cy="541" r="4" fill="#CBD5E1"/>
<circle cx="644" cy="541" r="4" fill="#CBD5E1"/>
<circle cx="658" cy="541" r="4" fill="#CBD5E1"/>
<text x="744" y="546" class="wintitle" text-anchor="middle">Phone</text>
</g>
<g class="rise" style="animation-delay:2.94s"><text x="630" y="588" class="rowname" text-anchor="start">Talk to AgentX</text><rect x="630" y="597" width="92" height="22" rx="11" fill="#1A66FF" fill-opacity="0.1"/><circle cx="641" cy="608" r="3.5" fill="#1A66FF" class="blink"/><text x="650" y="612.5" class="state" style="fill:#1A66FF">Listening…</text></g>
<g class="rise" style="animation-delay:3.84s"><text x="44" y="728" class="band warn" text-anchor="start">IF IT DOES NOT WORK</text></g>
<g class="rise" style="animation-delay:4.04s"><circle cx="49" cy="754.5" r="4" fill="#B45309"/><text x="62" y="760" class="symptom" text-anchor="start">The watch doesn't ring</text><text x="62" y="780" class="note" text-anchor="start">Pair it as a headset; turn on calls.</text></g>
<g class="rise" style="animation-delay:4.29s"><circle cx="465" cy="754.5" r="4" fill="#B45309"/><text x="478" y="760" class="symptom" text-anchor="start">The sound is on the phone</text><text x="478" y="780" class="note" text-anchor="start">Allow Nearby devices for AgentX.</text></g>
<g class="rise" style="animation-delay:4.54s"><circle cx="49" cy="806.5" r="4" fill="#B45309"/><text x="62" y="812" class="symptom" text-anchor="start">“I didn't hear anything”</text><text x="62" y="832" class="note" text-anchor="start">Speak right after the beep.</text></g>
<g class="rise" style="animation-delay:4.79s"><circle cx="465" cy="806.5" r="4" fill="#B45309"/><text x="478" y="812" class="symptom" text-anchor="start">“Could not reach your computer”</text><text x="478" y="832" class="note" text-anchor="start">Turn on Tailscale on the phone.</text></g>
</svg>
