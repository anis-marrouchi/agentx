<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1130" width="920" height="1130" role="img" aria-labelledby="t d" style="--cycle:6.3s">
<title id="t">How a workflow follows a request</title>
<desc id="d">Nine steps in three parts. You ask an agent for something with several steps; the agent starts a workflow, a saved one or one built from your words; you are told which one it chose. Then the workflow follows each step on its own: agent steps run one after the other, a slow step gets a reminder, and you approve the message to the client once, on a decision card. The client gets the message, and their reply moves the run on. At the end you get one summary with the proof of every step. A step that cannot go on without you is marked blocked and you are told once.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B0D12" flood-opacity="0.07"/></filter></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B0D12; }
.h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.sub { font-size: 16px; fill: #475569; }
.legend { font-size: 14px; font-weight: 600; }
.band { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; fill: #1A66FF; }
.band.warn { fill: #B45309; }
.title { font-size: 17px; font-weight: 650; }
.note { font-size: 14px; fill: #475569; }
.rowname { font-size: 15px; font-weight: 600; }
.symptom { font-size: 15.5px; font-weight: 650; }
.state { font-size: 12.5px; font-weight: 600; }
.num { font-size: 14.5px; font-weight: 700; fill: #fff; }
.pill { font-size: 13px; font-weight: 700; fill: #fff; }
.wintitle { font-size: 13.5px; font-weight: 600; fill: #475569; }
.card { fill: #fff; stroke: #E2E8F0; stroke-width: 1.25; filter: url(#soft); }
.card.accent { stroke: #C7D9FF; }
.card.win { stroke: #0B0D12; stroke-width: 1.5; }
.link { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100; animation: draw 0.9s ease-in-out backwards; }
.rise { animation: rise 0.55s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade 0.4s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse var(--cycle) ease-out infinite; }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 9% { opacity: 0; transform: scale(1.9); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rise, .fade, .wrap, .pulse, .blink { animation: none; } }
</style>
<rect width="920" height="1130" rx="24" fill="#FFFFFF"/>
<text x="44" y="56" class="h1" text-anchor="start">How a workflow follows a request</text>
<text x="44" y="82" class="sub" text-anchor="start">You ask once. AgentX starts each step, reminds whoever is slow, and tells you once.</text>
<circle cx="704" cy="50" r="7" fill="#1A66FF"/><text x="718" y="55" class="legend" text-anchor="start">You, the owner</text>
<circle cx="704" cy="74" r="7" fill="#0B0D12"/><text x="718" y="79" class="legend" text-anchor="start">Agents and the client</text>
<rect x="20" y="104" width="880" height="200" rx="20" fill="#F3F7FF"/>
<text x="44" y="132" class="band" text-anchor="start">YOU ASK</text>
<g class="rise" style="animation-delay:0.32s">
<rect x="44" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:5.58s"/>
<circle cx="70" cy="176" r="15" fill="#1A66FF"/>
<text x="70" y="181" class="num" text-anchor="middle">1</text>
<text x="60" y="220" class="title" text-anchor="start">Ask an agent</text>
<text x="60" y="242" class="note" text-anchor="start">a request with</text>
<text x="60" y="259" class="note" text-anchor="start">several steps</text>
</g>
<g class="rise" style="animation-delay:0.64s">
<rect x="328" y="148" width="264" height="136" rx="14" class="card"/>
<circle cx="354" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:6.28s"/>
<circle cx="354" cy="176" r="15" fill="#0B0D12"/>
<text x="354" y="181" class="num" text-anchor="middle">2</text>
<text x="344" y="220" class="title" text-anchor="start">It starts a workflow</text>
<text x="344" y="242" class="note" text-anchor="start">a saved one, or one built</text>
<text x="344" y="259" class="note" text-anchor="start">from your words</text>
</g>
<g class="fade" style="animation-delay:0.47s"><path d="M311 216 H323" class="link"/><path d="M319 212 L324 216 L319 220" class="link"/></g>
<g class="rise" style="animation-delay:0.96s">
<rect x="612" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="638" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:6.98s"/>
<circle cx="638" cy="176" r="15" fill="#1A66FF"/>
<text x="638" y="181" class="num" text-anchor="middle">3</text>
<text x="628" y="220" class="title" text-anchor="start">You see which one</text>
<text x="628" y="242" class="note" text-anchor="start">unless the workflow is</text>
<text x="628" y="259" class="note" text-anchor="start">marked to start on its own</text>
</g>
<g class="fade" style="animation-delay:0.79s"><path d="M595 216 H607" class="link"/><path d="M603 212 L608 216 L603 220" class="link"/></g>
<rect x="20" y="320" width="880" height="372" rx="20" fill="#F6F7F9"/>
<text x="92" y="348" class="band" text-anchor="start">IT FOLLOWS EACH STEP</text>
<path d="M744 284 V302 Q744 312 734 312 H80 Q70 312 70 322 V360" class="wrap" pathLength="100" style="animation-delay:1.26s"/>
<path d="M65 355 L70 361 L75 355" class="link fade" style="animation-delay:2.16s"/>
<g class="rise" style="animation-delay:1.28s">
<rect x="44" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:7.68s"/>
<circle cx="70" cy="392" r="15" fill="#0B0D12"/>
<text x="70" y="397" class="num" text-anchor="middle">4</text>
<text x="60" y="436" class="title" text-anchor="start">Agent steps run</text>
<text x="60" y="458" class="note" text-anchor="start">each one starts when</text>
<text x="60" y="475" class="note" text-anchor="start">the one before is done</text>
</g>
<g class="rise" style="animation-delay:1.60s">
<rect x="328" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="354" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:8.38s"/>
<circle cx="354" cy="392" r="15" fill="#0B0D12"/>
<text x="354" y="397" class="num" text-anchor="middle">5</text>
<text x="344" y="436" class="title" text-anchor="start">A slow step gets</text>
<text x="344" y="457" class="title" text-anchor="start">a reminder</text>
<text x="344" y="479" class="note" text-anchor="start">after 30 minutes</text>
<text x="344" y="496" class="note" text-anchor="start">without progress</text>
</g>
<g class="fade" style="animation-delay:1.43s"><path d="M311 432 H323" class="link"/><path d="M319 428 L324 432 L319 436" class="link"/></g>
<g class="rise" style="animation-delay:1.92s">
<rect x="612" y="364" width="264" height="136" rx="14" class="card accent"/>
<circle cx="638" cy="392" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:9.08s"/>
<circle cx="638" cy="392" r="15" fill="#1A66FF"/>
<text x="638" y="397" class="num" text-anchor="middle">6</text>
<text x="628" y="436" class="title" text-anchor="start">Approve the message</text>
<text x="628" y="458" class="note" text-anchor="start">once, on a decision card;</text>
<text x="628" y="475" class="note" text-anchor="start">edit it if you like</text>
</g>
<g class="fade" style="animation-delay:1.75s"><path d="M595 432 H607" class="link"/><path d="M603 428 L608 432 L603 436" class="link"/></g>
<path d="M744 500 V508 Q744 518 734 518 H80 Q70 518 70 528 V532" class="wrap" pathLength="100" style="animation-delay:2.22s"/>
<path d="M65 527 L70 533 L75 527" class="link fade" style="animation-delay:3.12s"/>
<g class="rise" style="animation-delay:2.24s">
<rect x="44" y="536" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="564" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:9.78s"/>
<circle cx="70" cy="564" r="15" fill="#0B0D12"/>
<text x="70" y="569" class="num" text-anchor="middle">7</text>
<text x="60" y="608" class="title" text-anchor="start">The client gets it</text>
<text x="60" y="630" class="note" text-anchor="start">a reminder goes out</text>
<text x="60" y="647" class="note" text-anchor="start">if no answer comes</text>
</g>
<g class="rise" style="animation-delay:2.56s">
<rect x="328" y="536" width="264" height="136" rx="14" class="card"/>
<circle cx="354" cy="564" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:10.48s"/>
<circle cx="354" cy="564" r="15" fill="#0B0D12"/>
<text x="354" y="569" class="num" text-anchor="middle">8</text>
<text x="344" y="608" class="title" text-anchor="start">The client replies</text>
<text x="344" y="630" class="note" text-anchor="start">the reply moves</text>
<text x="344" y="647" class="note" text-anchor="start">the run on</text>
</g>
<g class="fade" style="animation-delay:2.39s"><path d="M311 604 H323" class="link"/><path d="M319 600 L324 604 L319 608" class="link"/></g>
<rect x="20" y="708" width="880" height="372" rx="20" fill="#F3F7FF"/>
<text x="92" y="736" class="band" text-anchor="start">YOU HEAR ONCE</text>
<path d="M460 672 V690 Q460 700 450 700 H80 Q70 700 70 710 V748" class="wrap" pathLength="100" style="animation-delay:2.86s"/>
<path d="M65 743 L70 749 L75 743" class="link fade" style="animation-delay:3.76s"/>
<g class="rise" style="animation-delay:2.88s">
<rect x="44" y="752" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="780" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:11.18s"/>
<circle cx="70" cy="780" r="15" fill="#1A66FF"/>
<text x="70" y="785" class="num" text-anchor="middle">9</text>
<text x="60" y="824" class="title" text-anchor="start">You get one summary</text>
<text x="60" y="846" class="note" text-anchor="start">every step with its proof,</text>
<text x="60" y="863" class="note" text-anchor="start">or why it stopped</text>
</g>
<g class="rise" style="animation-delay:3.28s"><rect x="612" y="570" width="244" height="68" rx="14" class="card"/><rect x="612" y="570" width="6" height="68" rx="3" fill="#DC2626"/><text x="634" y="599" class="title" text-anchor="start">A step is blocked</text><text x="634" y="621" class="note" text-anchor="start">You are told once.</text></g>
<g class="rise" style="animation-delay:3.08s">
<rect x="328" y="740" width="548" height="160" rx="14" class="card win"/>
<path d="M328 774 H876" stroke="#E2E8F0"/>
<circle cx="346" cy="757" r="4" fill="#CBD5E1"/>
<circle cx="360" cy="757" r="4" fill="#CBD5E1"/>
<circle cx="374" cy="757" r="4" fill="#CBD5E1"/>
<text x="602" y="762" class="wintitle" text-anchor="middle">Follow-ups · client:example-co</text>
</g>
<g class="rise" style="animation-delay:3.58s"><text x="346" y="804" class="rowname" text-anchor="start">Release 2.4</text><rect x="346" y="813" width="187" height="22" rx="11" fill="#1A66FF" fill-opacity="0.1"/><circle cx="357" cy="824" r="3.5" fill="#1A66FF" class="blink"/><text x="366" y="828.5" class="state" style="fill:#1A66FF">Waiting on your approval</text><path d="M346 847 H858" stroke="#E2E8F0"/></g>
<g class="rise" style="animation-delay:3.93s"><text x="346" y="860" class="rowname" text-anchor="start">March invoice</text><rect x="346" y="869" width="146" height="22" rx="11" fill="#B45309" fill-opacity="0.1"/><circle cx="357" cy="880" r="3.5" fill="#B45309"/><text x="366" y="884.5" class="state" style="fill:#B45309">Waiting on a reply</text></g>
<g class="rise" style="animation-delay:4.48s"><text x="44" y="944" class="band warn" text-anchor="start">IF IT DOES NOT WORK</text></g>
<g class="rise" style="animation-delay:4.68s"><circle cx="49" cy="970.5" r="4" fill="#B45309"/><text x="62" y="976" class="symptom" text-anchor="start">The agent did the steps by hand</text><text x="62" y="996" class="note" text-anchor="start">Check the follow-up settings are on.</text></g>
<g class="rise" style="animation-delay:4.93s"><circle cx="465" cy="970.5" r="4" fill="#B45309"/><text x="478" y="976" class="symptom" text-anchor="start">Nothing moves after you answer</text><text x="478" y="996" class="note" text-anchor="start">Answers are picked up each minute.</text></g>
<g class="rise" style="animation-delay:5.18s"><circle cx="49" cy="1022.5" r="4" fill="#B45309"/><text x="62" y="1028" class="symptom" text-anchor="start">The client never got it</text><text x="62" y="1048" class="note" text-anchor="start">The channel must be connected here.</text></g>
<g class="rise" style="animation-delay:5.43s"><circle cx="465" cy="1022.5" r="4" fill="#B45309"/><text x="478" y="1028" class="symptom" text-anchor="start">A step stays blocked</text><text x="478" y="1048" class="note" text-anchor="start">Sort it, or stop the run.</text></g>
</svg>
