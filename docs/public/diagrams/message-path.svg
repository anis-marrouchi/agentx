<text x="344" y="674" class="note" text-anchor="start">requests/: requests,</text>
<text x="344" y="691" class="note" text-anchor="start">plans, promises</text>
</g>
<g class="fade" style="animation-delay:2.39s"><path d="M311 648 H323" class="link"/><path d="M319 644 L324 648 L319 652" class="link"/></g>
<g class="rise" style="animation-delay:2.88s">
<rect x="612" y="580" width="264" height="136" rx="14" class="card"/>
<circle cx="638" cy="608" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:11.18s"/>
<circle cx="638" cy="608" r="15" fill="#0B0D12"/>
<text x="638" y="613" class="num" text-anchor="middle">9</text>
<text x="628" y="652" class="title" text-anchor="start">History and events</text>
<text x="628" y="674" class="note" text-anchor="start">events/ · storage/, shown</text>
<text x="628" y="691" class="note" text-anchor="start">by the dashboard (daemon/ui/)</text>
</g>
<g class="fade" style="animation-delay:2.71s"><path d="M595 648 H607" class="link"/><path d="M603 644 L608 648 L603 652" class="link"/></g>
<g class="rise" style="animation-delay:3.28s"><rect x="44" y="748" width="548" height="68" rx="14" class="card"/><rect x="44" y="748" width="6" height="68" rx="3" fill="#1A66FF"/><text x="66" y="777" class="title" text-anchor="start">The agent is on another machine</text><text x="66" y="799" class="note" text-anchor="start">The router hands the message to that mesh peer: src/a2a/.</text></g>
<g class="rise" style="animation-delay:4.08s"><text x="44" y="864" class="band" text-anchor="start">AROUND THE PATH</text></g>
<g class="rise" style="animation-delay:4.28s"><circle cx="49" cy="890.5" r="4" fill="#1A66FF"/><text x="62" y="896" class="symptom" text-anchor="start">Schedules and jobs</text><text x="62" y="916" class="note" text-anchor="start">crons/ · jobs/: work that starts by itself</text></g>
<g class="rise" style="animation-delay:4.53s"><circle cx="465" cy="890.5" r="4" fill="#1A66FF"/><text x="478" y="896" class="symptom" text-anchor="start">Workflows</text><text x="478" y="916" class="note" text-anchor="start">workflows/: saved steps, engine and runs</text></g>
<g class="rise" style="animation-delay:4.78s"><circle cx="49" cy="942.5" r="4" fill="#1A66FF"/><text x="62" y="948" class="symptom" text-anchor="start">Wiki and memory</text><text x="62" y="968" class="note" text-anchor="start">wiki/ · memory/: what agents know</text></g>
<g class="rise" style="animation-delay:5.03s"><circle cx="465" cy="942.5" r="4" fill="#1A66FF"/><text x="478" y="948" class="symptom" text-anchor="start">AgentX Voice</text><text x="478" y="968" class="note" text-anchor="start">apps/mac-voice/ · voice/: speak, hear</text></g>
</svg>
