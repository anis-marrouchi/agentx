<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 900" width="920" height="900" role="img" aria-labelledby="t d" style="--cycle:4.2s">
<title id="t">How a code editor uses AgentX's tools</title>
<desc id="d">Six steps in two parts. You set it up once: add agentx serve --stdio to the editor's list of tool servers, choose the read or full tool set, and restart the editor. Then, while you work: the editor starts the tool server, which finds the AgentX node and its token; the editor's assistant calls a tool; the tool server asks the node with the token and passes the answer back. When the node refuses, the tool answers with the reason, usually a missing or wrong token.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B0D12" flood-opacity="0.07"/></filter></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B0D12; }
.h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.sub { font-size: 16px; fill: #475569; }
.legend { font-size: 14px; font-weight: 600; }
.band { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; fill: #1A66FF; }
.band.warn { fill: #B45309; }
.title { font-size: 17px; font-weight: 650; }
.note { font-size: 14px; fill: #475569; }
.rowname { font-size: 15px; font-weight: 600; }
.symptom { font-size: 15.5px; font-weight: 650; }
.state { font-size: 12.5px; font-weight: 600; }
.num { font-size: 14.5px; font-weight: 700; fill: #fff; }
.pill { font-size: 13px; font-weight: 700; fill: #fff; }
.wintitle { font-size: 13.5px; font-weight: 600; fill: #475569; }
.card { fill: #fff; stroke: #E2E8F0; stroke-width: 1.25; filter: url(#soft); }
.card.accent { stroke: #C7D9FF; }
.card.win { stroke: #0B0D12; stroke-width: 1.5; }
.link { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100; animation: draw 0.9s ease-in-out backwards; }
.rise { animation: rise 0.55s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade 0.4s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse var(--cycle) ease-out infinite; }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 9% { opacity: 0; transform: scale(1.9); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rise, .fade, .wrap, .pulse, .blink { animation: none; } }
</style>
<rect width="920" height="900" rx="24" fill="#FFFFFF"/>
<text x="44" y="56" class="h1" text-anchor="start">How a code editor uses AgentX's tools</text>
<text x="44" y="82" class="sub" text-anchor="start">You add it once. The editor starts it each time.</text>
<circle cx="704" cy="50" r="7" fill="#1A66FF"/><text x="718" y="55" class="legend" text-anchor="start">You</text>
<circle cx="704" cy="74" r="7" fill="#0B0D12"/><text x="718" y="79" class="legend" text-anchor="start">The editor and AgentX</text>
<rect x="20" y="104" width="880" height="200" rx="20" fill="#F3F7FF"/>
<text x="44" y="132" class="band" text-anchor="start">YOU SET IT UP ONCE</text>
<g class="rise" style="animation-delay:0.32s">
<rect x="44" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:4.62s"/>
<circle cx="70" cy="176" r="15" fill="#1A66FF"/>
<text x="70" y="181" class="num" text-anchor="middle">1</text>
<text x="60" y="220" class="title" text-anchor="start">Add agentx to the</text>
<text x="60" y="241" class="title" text-anchor="start">editor's tool servers</text>
<text x="60" y="263" class="note" text-anchor="start">command: agentx</text>
<text x="60" y="280" class="note" text-anchor="start">args: serve --stdio</text>
</g>
<g class="rise" style="animation-delay:0.64s">
<rect x="328" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:5.32s"/>
<circle cx="354" cy="176" r="15" fill="#1A66FF"/>
<text x="354" y="181" class="num" text-anchor="middle">2</text>
<text x="344" y="220" class="title" text-anchor="start">Choose a tool set</text>
<text x="344" y="242" class="note" text-anchor="start">--tools read: looks only</text>
<text x="344" y="259" class="note" text-anchor="start">--tools full: everything</text>
</g>
<g class="fade" style="animation-delay:0.47s"><path d="M311 216 H323" class="link"/><path d="M319 212 L324 216 L319 220" class="link"/></g>
<g class="rise" style="animation-delay:0.96s">
<rect x="612" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="638" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:6.02s"/>
<circle cx="638" cy="176" r="15" fill="#1A66FF"/>
<text x="638" y="181" class="num" text-anchor="middle">3</text>
<text x="628" y="220" class="title" text-anchor="start">Restart the editor</text>
<text x="628" y="242" class="note" text-anchor="start">it reads the list</text>
<text x="628" y="259" class="note" text-anchor="start">when it starts</text>
</g>
<g class="fade" style="animation-delay:0.79s"><path d="M595 216 H607" class="link"/><path d="M603 212 L608 216 L603 220" class="link"/></g>
<rect x="20" y="320" width="880" height="200" rx="20" fill="#F6F7F9"/>
<text x="92" y="348" class="band" text-anchor="start">WHILE YOU WORK</text>
<path d="M744 284 V302 Q744 312 734 312 H80 Q70 312 70 322 V360" class="wrap" pathLength="100" style="animation-delay:1.26s"/>
<path d="M65 355 L70 361 L75 355" class="link fade" style="animation-delay:2.16s"/>
<g class="rise" style="animation-delay:1.28s">
<rect x="44" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:6.72s"/>
<circle cx="70" cy="392" r="15" fill="#0B0D12"/>
<text x="70" y="397" class="num" text-anchor="middle">4</text>
<text x="60" y="436" class="title" text-anchor="start">The editor starts</text>
<text x="60" y="457" class="title" text-anchor="start">the tool server</text>
<text x="60" y="479" class="note" text-anchor="start">it finds the node's address</text>
<text x="60" y="496" class="note" text-anchor="start">and its token</text>
</g>
<g class="rise" style="animation-delay:1.60s">
<rect x="328" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="354" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:7.42s"/>
<circle cx="354" cy="392" r="15" fill="#0B0D12"/>
<text x="354" y="397" class="num" text-anchor="middle">5</text>
<text x="344" y="436" class="title" text-anchor="start">The assistant calls</text>
<text x="344" y="457" class="title" text-anchor="start">a tool</text>
<text x="344" y="479" class="note" text-anchor="start">for example agentx_health</text>
</g>
<g class="fade" style="animation-delay:1.43s"><path d="M311 432 H323" class="link"/><path d="M319 428 L324 432 L319 436" class="link"/></g>
<g class="rise" style="animation-delay:1.92s">
<rect x="612" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="638" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:8.12s"/>
<circle cx="638" cy="392" r="15" fill="#0B0D12"/>
<text x="638" y="397" class="num" text-anchor="middle">6</text>
<text x="628" y="436" class="title" text-anchor="start">The node answers</text>
<text x="628" y="458" class="note" text-anchor="start">the call carries</text>
<text x="628" y="475" class="note" text-anchor="start">Authorization: Bearer</text>
</g>
<g class="fade" style="animation-delay:1.75s"><path d="M595 432 H607" class="link"/><path d="M603 428 L608 432 L603 436" class="link"/></g>
<g class="rise" style="animation-delay:2.32s"><rect x="612" y="540" width="264" height="68" rx="14" class="card"/><rect x="612" y="540" width="6" height="68" rx="3" fill="#DC2626"/><text x="634" y="569" class="title" text-anchor="start">The node refuses</text><text x="634" y="591" class="note" text-anchor="start">Often the token is missing.</text></g>
<g class="rise" style="animation-delay:2.12s">
<rect x="44" y="540" width="528" height="160" rx="14" class="card win"/>
<path d="M44 574 H572" stroke="#E2E8F0"/>
<circle cx="62" cy="557" r="4" fill="#CBD5E1"/>
<circle cx="76" cy="557" r="4" fill="#CBD5E1"/>
<circle cx="90" cy="557" r="4" fill="#CBD5E1"/>
<text x="308" y="562" class="wintitle" text-anchor="middle">Editor: tool servers</text>
</g>
<g class="rise" style="animation-delay:2.62s"><text x="62" y="604" class="rowname" text-anchor="start">agentx</text><rect x="62" y="613" width="85" height="22" rx="11" fill="#0F766E" fill-opacity="0.1"/><circle cx="73" cy="624" r="3.5" fill="#0F766E" class="blink"/><text x="82" y="628.5" class="state" style="fill:#0F766E">connected</text><path d="M62 647 H554" stroke="#E2E8F0"/></g>
<g class="rise" style="animation-delay:2.97s"><text x="62" y="660" class="rowname" text-anchor="start">10 tools (read set)</text><rect x="62" y="669" width="133" height="22" rx="11" fill="#1A66FF" fill-opacity="0.1"/><circle cx="73" cy="680" r="3.5" fill="#1A66FF"/><text x="82" y="684.5" class="state" style="fill:#1A66FF">or 29 (full set)</text></g>
<g class="rise" style="animation-delay:3.52s"><text x="44" y="740" class="band warn" text-anchor="start">IF IT DOES NOT WORK</text></g>
<g class="rise" style="animation-delay:3.72s"><circle cx="49" cy="766.5" r="4" fill="#B45309"/><text x="62" y="772" class="symptom" text-anchor="start">The server is not listed</text><text x="62" y="792" class="note" text-anchor="start">Restart the editor after saving.</text></g>
<g class="rise" style="animation-delay:3.97s"><circle cx="465" cy="766.5" r="4" fill="#B45309"/><text x="478" y="772" class="symptom" text-anchor="start">“fetch failed”</text><text x="478" y="792" class="note" text-anchor="start">Start the node, or set AGENTX_DAEMON_URL.</text></g>
<g class="rise" style="animation-delay:4.22s"><circle cx="49" cy="818.5" r="4" fill="#B45309"/><text x="62" y="824" class="symptom" text-anchor="start">“Unauthorized”</text><text x="62" y="844" class="note" text-anchor="start">Set AGENTX_TOKEN to the node's token.</text></g>
<g class="rise" style="animation-delay:4.47s"><circle cx="465" cy="818.5" r="4" fill="#B45309"/><text x="478" y="824" class="symptom" text-anchor="start">“not in the read tool set”</text><text x="478" y="844" class="note" text-anchor="start">Use --tools full for that tool.</text></g>
</svg>
