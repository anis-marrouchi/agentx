<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1256" width="920" height="1256" role="img" aria-labelledby="t d" style="--cycle:9.1s">
<title id="t">How a teammate joins AgentX</title>
<desc id="d">Thirteen steps in three parts. The owner prepares: add the person, publish only the member page, limit shared users to port 443, create the invite, share the computer in Tailscale, send the address and the code. The teammate's four steps on one strip: install Tailscale and accept the share, open the address, enter a machine name and the code, wait for the owner. The owner says yes on a decision card. The page becomes My work and can be installed as an app. A no, or three days without an answer, ends the key.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B0D12" flood-opacity="0.07"/></filter></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B0D12; }
.h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.sub { font-size: 16px; fill: #475569; }
.legend { font-size: 14px; font-weight: 600; }
.band { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; fill: #1A66FF; }
.band.warn { fill: #B45309; }
.title { font-size: 17px; font-weight: 650; }
.note { font-size: 14px; fill: #475569; }
.rowname { font-size: 15px; font-weight: 600; }
.symptom { font-size: 15.5px; font-weight: 650; }
.state { font-size: 12.5px; font-weight: 600; }
.num { font-size: 14.5px; font-weight: 700; fill: #fff; }
.pill { font-size: 13px; font-weight: 700; fill: #fff; }
.wintitle { font-size: 13.5px; font-weight: 600; fill: #475569; }
.card { fill: #fff; stroke: #E2E8F0; stroke-width: 1.25; filter: url(#soft); }
.card.accent { stroke: #C7D9FF; }
.card.win { stroke: #0B0D12; stroke-width: 1.5; }
.link { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100; animation: draw 0.9s ease-in-out backwards; }
.rise { animation: rise 0.55s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade 0.4s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse var(--cycle) ease-out infinite; }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 9% { opacity: 0; transform: scale(1.9); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rise, .fade, .wrap, .pulse, .blink { animation: none; } }
</style>
<rect width="920" height="1256" rx="24" fill="#FFFFFF"/>
<text x="44" y="56" class="h1" text-anchor="start">How a teammate joins</text>
<text x="44" y="82" class="sub" text-anchor="start">You prepare once. They pair in a minute. Nothing opens until you say yes.</text>
<circle cx="704" cy="50" r="7" fill="#1A66FF"/><text x="718" y="55" class="legend" text-anchor="start">You, the owner</text>
<circle cx="704" cy="74" r="7" fill="#0B0D12"/><text x="718" y="79" class="legend" text-anchor="start">The teammate</text>
<rect x="20" y="104" width="880" height="372" rx="20" fill="#F3F7FF"/>
<text x="44" y="132" class="band" text-anchor="start">YOU PREPARE</text>
<g class="rise" style="animation-delay:0.32s">
<rect x="44" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:6.86s"/>
<circle cx="70" cy="176" r="15" fill="#1A66FF"/>
<text x="70" y="181" class="num" text-anchor="middle">1</text>
<text x="60" y="220" class="title" text-anchor="start">Add them to People</text>
<text x="60" y="242" class="note" text-anchor="start">with the account they write from</text>
</g>
<g class="rise" style="animation-delay:0.64s">
<rect x="328" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:7.56s"/>
<circle cx="354" cy="176" r="15" fill="#1A66FF"/>
<text x="354" y="181" class="num" text-anchor="middle">2</text>
<text x="344" y="220" class="title" text-anchor="start">Publish only the</text>
<text x="344" y="241" class="title" text-anchor="start">member page</text>
<text x="344" y="263" class="note" text-anchor="start">nothing else of yours is reachable</text>
</g>
<g class="fade" style="animation-delay:0.47s"><path d="M311 216 H323" class="link"/><path d="M319 212 L324 216 L319 220" class="link"/></g>
<g class="rise" style="animation-delay:0.96s">
<rect x="612" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="638" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:8.26s"/>
<circle cx="638" cy="176" r="15" fill="#1A66FF"/>
<text x="638" y="181" class="num" text-anchor="middle">3</text>
<text x="628" y="220" class="title" text-anchor="start">Limit shared users</text>
<text x="628" y="241" class="title" text-anchor="start">to port 443</text>
<text x="628" y="263" class="note" text-anchor="start">in the Tailscale access rules</text>
</g>
<g class="fade" style="animation-delay:0.79s"><path d="M595 216 H607" class="link"/><path d="M603 212 L608 216 L603 220" class="link"/></g>
<path d="M744 284 V292 Q744 302 734 302 H80 Q70 302 70 312 V316" class="wrap" pathLength="100" style="animation-delay:1.26s"/>
<path d="M65 311 L70 317 L75 311" class="link fade" style="animation-delay:2.16s"/>
<g class="rise" style="animation-delay:1.28s">
<rect x="44" y="320" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="348" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:8.96s"/>
<circle cx="70" cy="348" r="15" fill="#1A66FF"/>
<text x="70" y="353" class="num" text-anchor="middle">4</text>
<text x="60" y="392" class="title" text-anchor="start">Create the invite</text>
<text x="60" y="414" class="note" text-anchor="start">agentx people invite prints</text>
<text x="60" y="431" class="note" text-anchor="start">the address and a code</text>
</g>
<g class="rise" style="animation-delay:1.60s">
<rect x="328" y="320" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="348" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:9.66s"/>
<circle cx="354" cy="348" r="15" fill="#1A66FF"/>
<text x="354" y="353" class="num" text-anchor="middle">5</text>
<text x="344" y="392" class="title" text-anchor="start">Share this computer</text>
<text x="344" y="413" class="title" text-anchor="start">in Tailscale</text>
<text x="344" y="435" class="note" text-anchor="start">admin console: Machines › Share</text>
</g>
<g class="fade" style="animation-delay:1.43s"><path d="M311 388 H323" class="link"/><path d="M319 384 L324 388 L319 392" class="link"/></g>
<g class="rise" style="animation-delay:1.92s">
<rect x="612" y="320" width="264" height="136" rx="14" class="card accent"/>
<circle cx="638" cy="348" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:10.36s"/>
<circle cx="638" cy="348" r="15" fill="#1A66FF"/>
<text x="638" y="353" class="num" text-anchor="middle">6</text>
<text x="628" y="392" class="title" text-anchor="start">Send the address</text>
<text x="628" y="413" class="title" text-anchor="start">and the code</text>
<text x="628" y="435" class="note" text-anchor="start">the code works once, for 10 minutes</text>
</g>
<g class="fade" style="animation-delay:1.75s"><path d="M595 388 H607" class="link"/><path d="M603 384 L608 388 L603 392" class="link"/></g>
<rect x="20" y="492" width="880" height="372" rx="20" fill="#F6F7F9"/>
<text x="92" y="520" class="band" text-anchor="start">THE TEAMMATE PAIRS, YOU APPROVE</text>
<path d="M744 456 V474 Q744 484 734 484 H80 Q70 484 70 494 V532" class="wrap" pathLength="100" style="animation-delay:2.22s"/>
<path d="M65 527 L70 533 L75 527" class="link fade" style="animation-delay:3.12s"/>
<g class="rise" style="animation-delay:2.24s">
<rect x="44" y="536" width="196" height="136" rx="14" class="card"/>
<circle cx="70" cy="564" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:11.06s"/>
<circle cx="70" cy="564" r="15" fill="#0B0D12"/>
<text x="70" y="569" class="num" text-anchor="middle">7</text>
<text x="60" y="608" class="title" text-anchor="start">Install Tailscale,</text>
<text x="60" y="629" class="title" text-anchor="start">accept the share</text>
<text x="60" y="651" class="note" text-anchor="start">on their own machine</text>
</g>
<g class="rise" style="animation-delay:2.56s">
<rect x="256" y="536" width="196" height="136" rx="14" class="card"/>
<circle cx="282" cy="564" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:11.76s"/>
<circle cx="282" cy="564" r="15" fill="#0B0D12"/>
<text x="282" y="569" class="num" text-anchor="middle">8</text>
<text x="272" y="608" class="title" text-anchor="start">Open the address</text>
<text x="272" y="630" class="note" text-anchor="start">in Edge or Chrome</text>
</g>
<g class="fade" style="animation-delay:2.39s"><path d="M243 604 H251" class="link"/><path d="M247 600 L252 604 L247 608" class="link"/></g>
<g class="rise" style="animation-delay:2.88s">
<rect x="468" y="536" width="196" height="136" rx="14" class="card"/>
<circle cx="494" cy="564" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:12.46s"/>
<circle cx="494" cy="564" r="15" fill="#0B0D12"/>
<text x="494" y="569" class="num" text-anchor="middle">9</text>
<text x="484" y="608" class="title" text-anchor="start">Enter a name</text>
<text x="484" y="629" class="title" text-anchor="start">and the code</text>
<text x="484" y="651" class="note" text-anchor="start">then press</text>
<text x="484" y="668" class="note" text-anchor="start">Pair this machine</text>
</g>
<g class="fade" style="animation-delay:2.71s"><path d="M455 604 H463" class="link"/><path d="M459 600 L464 604 L459 608" class="link"/></g>
<g class="rise" style="animation-delay:3.20s">
<rect x="680" y="536" width="196" height="136" rx="14" class="card"/>
<circle cx="706" cy="564" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:13.16s"/>
<circle cx="706" cy="564" r="15" fill="#0B0D12"/>
<text x="706" y="569" class="num" text-anchor="middle">10</text>
<text x="696" y="608" class="title" text-anchor="start">Waiting for</text>
<text x="696" y="629" class="title" text-anchor="start">the owner</text>
<text x="696" y="651" class="note" text-anchor="start">the page moves on</text>
<text x="696" y="668" class="note" text-anchor="start">by itself</text>
</g>
<g class="fade" style="animation-delay:3.03s"><path d="M667 604 H675" class="link"/><path d="M671 600 L676 604 L671 608" class="link"/></g>
<path d="M778 672 V680 Q778 690 768 690 H80 Q70 690 70 700 V704" class="wrap" pathLength="100" style="animation-delay:3.50s"/>
<path d="M65 699 L70 705 L75 699" class="link fade" style="animation-delay:4.40s"/>
<g class="rise" style="animation-delay:3.52s">
<rect x="44" y="708" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="736" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:13.86s"/>
<circle cx="70" cy="736" r="15" fill="#1A66FF"/>
<text x="70" y="741" class="num" text-anchor="middle">11</text>
<text x="60" y="780" class="title" text-anchor="start">Say yes on the card</text>
<text x="60" y="802" class="note" text-anchor="start">“New machine for …” in your</text>
<text x="60" y="819" class="note" text-anchor="start">Approvals inbox</text>
</g>
<rect x="20" y="880" width="880" height="372" rx="20" fill="#F3F7FF"/>
<text x="92" y="908" class="band" text-anchor="start">CONNECTED</text>
<path d="M176 844 V862 Q176 872 166 872 H80 Q70 872 70 882 V920" class="wrap" pathLength="100" style="animation-delay:3.82s"/>
<path d="M65 915 L70 921 L75 915" class="link fade" style="animation-delay:4.72s"/>
<g class="fade" style="animation-delay:4.12s"><rect x="102.5" y="861" width="43.5" height="22" rx="11" fill="#1A66FF"/><text x="124.3" y="876.5" class="pill" text-anchor="middle">Yes</text></g>
<g class="rise" style="animation-delay:3.84s">
<rect x="44" y="924" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="952" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:14.56s"/>
<circle cx="70" cy="952" r="15" fill="#0B0D12"/>
<text x="70" y="957" class="num" text-anchor="middle">12</text>
<text x="60" y="996" class="title" text-anchor="start">The page becomes My work</text>
<text x="60" y="1018" class="note" text-anchor="start">only their own requests.</text>
<text x="60" y="1035" class="note" text-anchor="start">The key lasts 90 days</text>
</g>
<g class="rise" style="animation-delay:4.16s">
<rect x="328" y="924" width="264" height="136" rx="14" class="card"/>
<circle cx="354" cy="952" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:15.26s"/>
<circle cx="354" cy="952" r="15" fill="#0B0D12"/>
<text x="354" y="957" class="num" text-anchor="middle">13</text>
<text x="344" y="996" class="title" text-anchor="start">Install it as an app</text>
<text x="344" y="1018" class="note" text-anchor="start">browser menu › Apps ›</text>
<text x="344" y="1035" class="note" text-anchor="start">Install this site as an app</text>
</g>
<g class="fade" style="animation-delay:3.99s"><path d="M311 992 H323" class="link"/><path d="M319 988 L324 992 L319 996" class="link"/></g>
<g class="rise" style="animation-delay:4.56s"><rect x="328" y="742" width="264" height="68" rx="14" class="card"/><rect x="328" y="742" width="6" height="68" rx="3" fill="#DC2626"/><text x="350" y="771" class="title" text-anchor="start">No, or 3 days pass</text><text x="350" y="793" class="note" text-anchor="start">The key ends. Nothing is shared.</text></g>
<g class="rise" style="animation-delay:4.36s">
<rect x="612" y="924" width="264" height="160" rx="14" class="card win"/>
<path d="M612 958 H876" stroke="#E2E8F0"/>
<circle cx="630" cy="941" r="4" fill="#CBD5E1"/>
<circle cx="644" cy="941" r="4" fill="#CBD5E1"/>
<circle cx="658" cy="941" r="4" fill="#CBD5E1"/>
<text x="744" y="946" class="wintitle" text-anchor="middle">My work</text>
</g>
<g class="rise" style="animation-delay:4.86s"><text x="630" y="988" class="rowname" text-anchor="start">Invoice export for March</text><rect x="630" y="997" width="99" height="22" rx="11" fill="#1A66FF" fill-opacity="0.1"/><circle cx="641" cy="1008" r="3.5" fill="#1A66FF" class="blink"/><text x="650" y="1012.5" class="state" style="fill:#1A66FF">In progress</text><path d="M630 1031 H858" stroke="#E2E8F0"/></g>
<g class="rise" style="animation-delay:5.21s"><text x="630" y="1044" class="rowname" text-anchor="start">Fix the login redirect</text><rect x="630" y="1053" width="133" height="22" rx="11" fill="#B45309" fill-opacity="0.1"/><circle cx="641" cy="1064" r="3.5" fill="#B45309"/><text x="650" y="1068.5" class="state" style="fill:#B45309">Waiting on owner</text></g>
<g class="rise" style="animation-delay:5.76s"><text x="44" y="1116" class="band warn" text-anchor="start">IF IT DOES NOT WORK</text></g>
<g class="rise" style="animation-delay:5.96s"><circle cx="49" cy="1142.5" r="4" fill="#B45309"/><text x="62" y="1148" class="symptom" text-anchor="start">“That code didn’t work”</text><text x="62" y="1168" class="note" text-anchor="start">Invite again: one use, 10 minutes.</text></g>
<g class="rise" style="animation-delay:6.21s"><circle cx="465" cy="1142.5" r="4" fill="#B45309"/><text x="478" y="1148" class="symptom" text-anchor="start">“Someone else is connecting”</text><text x="478" y="1168" class="note" text-anchor="start">Their Tailscale login differs from People.</text></g>
<g class="rise" style="animation-delay:6.46s"><circle cx="49" cy="1194.5" r="4" fill="#B45309"/><text x="62" y="1200" class="symptom" text-anchor="start">Waiting does not end</text><text x="62" y="1220" class="note" text-anchor="start">Your card is still unanswered.</text></g>
<g class="rise" style="animation-delay:6.71s"><circle cx="465" cy="1194.5" r="4" fill="#B45309"/><text x="478" y="1200" class="symptom" text-anchor="start">My work is empty</text><text x="478" y="1220" class="note" text-anchor="start">Turn on request tracking, add their identity.</text></g>
</svg>
