<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1000" width="920" height="1000" role="img" aria-labelledby="t d" style="--cycle:6.3s">
<title id="t">How the merge policy sorts a pull request</title>
<desc id="d">Seven steps in three parts. You prepare: list your core folders, turn the policy on, and make agentx/merge-policy a required check. A pull request arrives: an agent opens it or pushes to it, and AgentX reads the changed files. An edge-only pull request gets success at once and merges on green CI. A pull request that touches a core path gets the core-change label and stays pending until a person approves its latest commit; then it turns green and merges on green CI. A new push asks for a new approval.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B0D12" flood-opacity="0.07"/></filter></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B0D12; }
.h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.sub { font-size: 16px; fill: #475569; }
.legend { font-size: 14px; font-weight: 600; }
.band { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; fill: #1A66FF; }
.band.warn { fill: #B45309; }
.title { font-size: 17px; font-weight: 650; }
.note { font-size: 14px; fill: #475569; }
.rowname { font-size: 15px; font-weight: 600; }
.symptom { font-size: 15.5px; font-weight: 650; }
.state { font-size: 12.5px; font-weight: 600; }
.num { font-size: 14.5px; font-weight: 700; fill: #fff; }
.pill { font-size: 13px; font-weight: 700; fill: #fff; }
.wintitle { font-size: 13.5px; font-weight: 600; fill: #475569; }
.card { fill: #fff; stroke: #E2E8F0; stroke-width: 1.25; filter: url(#soft); }
.card.accent { stroke: #C7D9FF; }
.card.win { stroke: #0B0D12; stroke-width: 1.5; }
.link { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100; animation: draw 0.9s ease-in-out backwards; }
.rise { animation: rise 0.55s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade 0.4s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse var(--cycle) ease-out infinite; }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 9% { opacity: 0; transform: scale(1.9); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rise, .fade, .wrap, .pulse, .blink { animation: none; } }
</style>
<rect width="920" height="1000" rx="24" fill="#FFFFFF"/>
<text x="44" y="56" class="h1" text-anchor="start">Core needs a person, edge merges itself</text>
<text x="44" y="82" class="sub" text-anchor="start">AgentX sorts each pull request by the files it changes.</text>
<circle cx="704" cy="50" r="7" fill="#1A66FF"/><text x="718" y="55" class="legend" text-anchor="start">You, the owner</text>
<circle cx="704" cy="74" r="7" fill="#0B0D12"/><text x="718" y="79" class="legend" text-anchor="start">AgentX and the agents</text>
<rect x="20" y="104" width="880" height="200" rx="20" fill="#F3F7FF"/>
<text x="44" y="132" class="band" text-anchor="start">YOU PREPARE</text>
<g class="rise" style="animation-delay:0.32s">
<rect x="44" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:5.58s"/>
<circle cx="70" cy="176" r="15" fill="#1A66FF"/>
<text x="70" y="181" class="num" text-anchor="middle">1</text>
<text x="60" y="220" class="title" text-anchor="start">List your core folders</text>
<text x="60" y="242" class="note" text-anchor="start">quality.mergePolicy.corePaths</text>
<text x="60" y="259" class="note" text-anchor="start">in agentx.json</text>
</g>
<g class="rise" style="animation-delay:0.64s">
<rect x="328" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:6.28s"/>
<circle cx="354" cy="176" r="15" fill="#1A66FF"/>
<text x="354" y="181" class="num" text-anchor="middle">2</text>
<text x="344" y="220" class="title" text-anchor="start">Turn the policy on</text>
<text x="344" y="242" class="note" text-anchor="start">quality.mergePolicy.enabled</text>
<text x="344" y="259" class="note" text-anchor="start">then restart the daemon</text>
</g>
<g class="fade" style="animation-delay:0.47s"><path d="M311 216 H323" class="link"/><path d="M319 212 L324 216 L319 220" class="link"/></g>
<g class="rise" style="animation-delay:0.96s">
<rect x="612" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="638" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:6.98s"/>
<circle cx="638" cy="176" r="15" fill="#1A66FF"/>
<text x="638" y="181" class="num" text-anchor="middle">3</text>
<text x="628" y="220" class="title" text-anchor="start">Require the check</text>
<text x="628" y="242" class="note" text-anchor="start">agentx/merge-policy in the</text>
<text x="628" y="259" class="note" text-anchor="start">branch rules on GitHub</text>
</g>
<g class="fade" style="animation-delay:0.79s"><path d="M595 216 H607" class="link"/><path d="M603 212 L608 216 L603 220" class="link"/></g>
<rect x="20" y="320" width="880" height="200" rx="20" fill="#F6F7F9"/>
<text x="92" y="348" class="band" text-anchor="start">A PULL REQUEST ARRIVES</text>
<path d="M744 284 V302 Q744 312 734 312 H80 Q70 312 70 322 V360" class="wrap" pathLength="100" style="animation-delay:1.26s"/>
<path d="M65 355 L70 361 L75 355" class="link fade" style="animation-delay:2.16s"/>
<g class="rise" style="animation-delay:1.28s">
<rect x="44" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:7.68s"/>
<circle cx="70" cy="392" r="15" fill="#0B0D12"/>
<text x="70" y="397" class="num" text-anchor="middle">4</text>
<text x="60" y="436" class="title" text-anchor="start">An agent opens or</text>
<text x="60" y="457" class="title" text-anchor="start">pushes to a pull request</text>
<text x="60" y="479" class="note" text-anchor="start">GitHub tells AgentX</text>
</g>
<g class="rise" style="animation-delay:1.60s">
<rect x="328" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="354" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:8.38s"/>
<circle cx="354" cy="392" r="15" fill="#0B0D12"/>
<text x="354" y="397" class="num" text-anchor="middle">5</text>
<text x="344" y="436" class="title" text-anchor="start">AgentX reads the</text>
<text x="344" y="457" class="title" text-anchor="start">changed files</text>
<text x="344" y="479" class="note" text-anchor="start">each one is core or edge</text>
</g>
<g class="fade" style="animation-delay:1.43s"><path d="M311 432 H323" class="link"/><path d="M319 428 L324 432 L319 436" class="link"/></g>
<g class="rise" style="animation-delay:1.92s">
<rect x="612" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="638" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:9.08s"/>
<circle cx="638" cy="392" r="15" fill="#0B0D12"/>
<text x="638" y="397" class="num" text-anchor="middle">6</text>
<text x="628" y="436" class="title" text-anchor="start">Edge only: success</text>
<text x="628" y="458" class="note" text-anchor="start">merges on green CI,</text>
<text x="628" y="475" class="note" text-anchor="start">as before</text>
</g>
<g class="fade" style="animation-delay:1.75s"><path d="M595 432 H607" class="link"/><path d="M603 428 L608 432 L603 436" class="link"/></g>
<rect x="20" y="536" width="880" height="200" rx="20" fill="#F3F7FF"/>
<text x="92" y="564" class="band" text-anchor="start">A CORE CHANGE WAITS FOR YOU</text>
<path d="M744 500 V518 Q744 528 734 528 H80 Q70 528 70 538 V576" class="wrap" pathLength="100" style="animation-delay:2.22s"/>
<path d="M65 571 L70 577 L75 571" class="link fade" style="animation-delay:3.12s"/>
<g class="fade" style="animation-delay:2.52s"><rect x="612" y="517" width="102" height="22" rx="11" fill="#1A66FF"/><text x="663" y="532.5" class="pill" text-anchor="middle">Touches core</text></g>
<g class="rise" style="animation-delay:2.24s">
<rect x="44" y="580" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="608" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:9.78s"/>
<circle cx="70" cy="608" r="15" fill="#0B0D12"/>
<text x="70" y="613" class="num" text-anchor="middle">7</text>
<text x="60" y="652" class="title" text-anchor="start">Labeled core-change,</text>
<text x="60" y="673" class="title" text-anchor="start">status pending</text>
<text x="60" y="695" class="note" text-anchor="start">auto-merge waits</text>
</g>
<g class="rise" style="animation-delay:2.56s">
<rect x="328" y="580" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="608" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:10.48s"/>
<circle cx="354" cy="608" r="15" fill="#1A66FF"/>
<text x="354" y="613" class="num" text-anchor="middle">8</text>
<text x="344" y="652" class="title" text-anchor="start">You approve the</text>
<text x="344" y="673" class="title" text-anchor="start">latest commit</text>
<text x="344" y="695" class="note" text-anchor="start">a review on GitHub</text>
</g>
<g class="fade" style="animation-delay:2.39s"><path d="M311 648 H323" class="link"/><path d="M319 644 L324 648 L319 652" class="link"/></g>
<g class="rise" style="animation-delay:2.88s">
<rect x="612" y="580" width="264" height="136" rx="14" class="card"/>
<circle cx="638" cy="608" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:11.18s"/>
<circle cx="638" cy="608" r="15" fill="#0B0D12"/>
<text x="638" y="613" class="num" text-anchor="middle">9</text>
<text x="628" y="652" class="title" text-anchor="start">Status turns green</text>
<text x="628" y="674" class="note" text-anchor="start">merges on green CI;</text>
<text x="628" y="691" class="note" text-anchor="start">a new push asks again</text>
</g>
<g class="fade" style="animation-delay:2.71s"><path d="M595 648 H607" class="link"/><path d="M603 644 L608 648 L603 652" class="link"/></g>
<g class="rise" style="animation-delay:4.08s"><text x="44" y="772" class="band warn" text-anchor="start">IF IT DOES NOT WORK</text></g>
<g class="rise" style="animation-delay:4.28s"><circle cx="49" cy="798.5" r="4" fill="#B45309"/><text x="62" y="804" class="symptom" text-anchor="start">No agentx/merge-policy status</text><text x="62" y="824" class="note" text-anchor="start">Check enabled, and the webhook events.</text></g>
<g class="rise" style="animation-delay:4.53s"><circle cx="465" cy="798.5" r="4" fill="#B45309"/><text x="478" y="804" class="symptom" text-anchor="start">Approved but still pending</text><text x="478" y="824" class="note" text-anchor="start">Approve the latest commit, not an older one.</text></g>
<g class="rise" style="animation-delay:4.78s"><circle cx="49" cy="850.5" r="4" fill="#B45309"/><text x="62" y="856" class="symptom" text-anchor="start">A core PR merged anyway</text><text x="62" y="876" class="note" text-anchor="start">Make the check required on GitHub.</text></g>
<g class="rise" style="animation-delay:5.03s"><circle cx="465" cy="850.5" r="4" fill="#B45309"/><text x="478" y="856" class="symptom" text-anchor="start">“check failed: …”</text><text x="478" y="876" class="note" text-anchor="start">GitHub did not answer; edit the PR to retry.</text></g>
</svg>
