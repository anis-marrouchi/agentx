<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 950" width="920" height="950" role="img" aria-labelledby="t d" style="--cycle:4.2s">
<title id="t">How a run that struggled becomes a fix</title>
<desc id="d">Six steps in two parts. A run struggles: it fails, is cut off by a restart, takes far longer than usual, or the session monitor notes friction. You run agentx retro with its task id. A reviewer reads the run and proposes up to four fixes, each tied to a step of the run. One decision card lists them, with None of these last. You pick one on the dashboard, the phone app, the Mac card or the terminal, and may edit the spec. The agent that ran the task builds the fix as a pull request or a guard rule in warn mode, and you review it again. A card nobody answers is discarded.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B0D12" flood-opacity="0.07"/></filter></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B0D12; }
.h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.sub { font-size: 16px; fill: #475569; }
.legend { font-size: 14px; font-weight: 600; }
.band { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; fill: #1A66FF; }
.band.warn { fill: #B45309; }
.title { font-size: 17px; font-weight: 650; }
.note { font-size: 14px; fill: #475569; }
.rowname { font-size: 15px; font-weight: 600; }
.symptom { font-size: 15.5px; font-weight: 650; }
.state { font-size: 12.5px; font-weight: 600; }
.num { font-size: 14.5px; font-weight: 700; fill: #fff; }
.pill { font-size: 13px; font-weight: 700; fill: #fff; }
.wintitle { font-size: 13.5px; font-weight: 600; fill: #475569; }
.card { fill: #fff; stroke: #E2E8F0; stroke-width: 1.25; filter: url(#soft); }
.card.accent { stroke: #C7D9FF; }
.card.win { stroke: #0B0D12; stroke-width: 1.5; }
.link { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100; animation: draw 0.9s ease-in-out backwards; }
.rise { animation: rise 0.55s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade 0.4s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse var(--cycle) ease-out infinite; }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 9% { opacity: 0; transform: scale(1.9); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rise, .fade, .wrap, .pulse, .blink { animation: none; } }
</style>
<rect width="920" height="950" rx="24" fill="#FFFFFF"/>
<text x="44" y="56" class="h1" text-anchor="start">How a run that struggled becomes a fix</text>
<text x="44" y="82" class="sub" text-anchor="start">A retro only proposes. Nothing changes until you pick.</text>
<circle cx="704" cy="50" r="7" fill="#1A66FF"/><text x="718" y="55" class="legend" text-anchor="start">You, the operator</text>
<circle cx="704" cy="74" r="7" fill="#0B0D12"/><text x="718" y="79" class="legend" text-anchor="start">AgentX and the agent</text>
<rect x="20" y="104" width="880" height="372" rx="20" fill="#F6F7F9"/>
<text x="44" y="132" class="band" text-anchor="start">THE RETRO PROPOSES</text>
<g class="rise" style="animation-delay:0.32s">
<rect x="44" y="148" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:4.62s"/>
<circle cx="70" cy="176" r="15" fill="#0B0D12"/>
<text x="70" y="181" class="num" text-anchor="middle">1</text>
<text x="60" y="220" class="title" text-anchor="start">A run struggles</text>
<text x="60" y="242" class="note" text-anchor="start">an error, a restart, far slower</text>
<text x="60" y="259" class="note" text-anchor="start">than usual, or friction</text>
</g>
<g class="rise" style="animation-delay:0.64s">
<rect x="328" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:5.32s"/>
<circle cx="354" cy="176" r="15" fill="#1A66FF"/>
<text x="354" y="181" class="num" text-anchor="middle">2</text>
<text x="344" y="220" class="title" text-anchor="start">Run agentx retro</text>
<text x="344" y="241" class="title" text-anchor="start">with its task id</text>
<text x="344" y="263" class="note" text-anchor="start">the id is in agentx trace list</text>
</g>
<g class="fade" style="animation-delay:0.47s"><path d="M311 216 H323" class="link"/><path d="M319 212 L324 216 L319 220" class="link"/></g>
<g class="rise" style="animation-delay:0.96s">
<rect x="612" y="148" width="264" height="136" rx="14" class="card"/>
<circle cx="638" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:6.02s"/>
<circle cx="638" cy="176" r="15" fill="#0B0D12"/>
<text x="638" y="181" class="num" text-anchor="middle">3</text>
<text x="628" y="220" class="title" text-anchor="start">A reviewer proposes</text>
<text x="628" y="241" class="title" text-anchor="start">up to four fixes</text>
<text x="628" y="263" class="note" text-anchor="start">each one tied to a step</text>
</g>
<g class="fade" style="animation-delay:0.79s"><path d="M595 216 H607" class="link"/><path d="M603 212 L608 216 L603 220" class="link"/></g>
<path d="M744 284 V292 Q744 302 734 302 H80 Q70 302 70 312 V316" class="wrap" pathLength="100" style="animation-delay:1.26s"/>
<path d="M65 311 L70 317 L75 311" class="link fade" style="animation-delay:2.16s"/>
<g class="rise" style="animation-delay:1.28s">
<rect x="44" y="320" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="348" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:6.72s"/>
<circle cx="70" cy="348" r="15" fill="#0B0D12"/>
<text x="70" y="353" class="num" text-anchor="middle">4</text>
<text x="60" y="392" class="title" text-anchor="start">One card in Approvals</text>
<text x="60" y="414" class="note" text-anchor="start">the fixes, then None of these;</text>
<text x="60" y="431" class="note" text-anchor="start">the most severe is picked</text>
</g>
<rect x="20" y="492" width="880" height="386" rx="20" fill="#F3F7FF"/>
<text x="92" y="520" class="band" text-anchor="start">YOU PICK, THE AGENT BUILDS</text>
<path d="M176 456 V474 Q176 484 166 484 H80 Q70 484 70 494 V532" class="wrap" pathLength="100" style="animation-delay:1.58s"/>
<path d="M65 527 L70 533 L75 527" class="link fade" style="animation-delay:2.48s"/>
<g class="rise" style="animation-delay:1.60s">
<rect x="44" y="536" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="564" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:7.42s"/>
<circle cx="70" cy="564" r="15" fill="#1A66FF"/>
<text x="70" y="569" class="num" text-anchor="middle">5</text>
<text x="60" y="608" class="title" text-anchor="start">Pick a fix</text>
<text x="60" y="630" class="note" text-anchor="start">dashboard, phone, Mac card</text>
<text x="60" y="647" class="note" text-anchor="start">or terminal; edit the spec</text>
</g>
<g class="rise" style="animation-delay:1.92s">
<rect x="328" y="536" width="264" height="136" rx="14" class="card"/>
<circle cx="354" cy="564" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:8.12s"/>
<circle cx="354" cy="564" r="15" fill="#0B0D12"/>
<text x="354" y="569" class="num" text-anchor="middle">6</text>
<text x="344" y="608" class="title" text-anchor="start">The agent builds it</text>
<text x="344" y="630" class="note" text-anchor="start">a pull request, or a guard</text>
<text x="344" y="647" class="note" text-anchor="start">rule in warn mode</text>
</g>
<g class="fade" style="animation-delay:1.75s"><path d="M311 604 H323" class="link"/><path d="M319 600 L324 604 L319 608" class="link"/></g>
<g class="rise" style="animation-delay:2.32s"><rect x="328" y="354" width="264" height="68" rx="14" class="card"/><rect x="328" y="354" width="6" height="68" rx="3" fill="#DC2626"/><text x="350" y="383" class="title" text-anchor="start">Nobody answers</text><text x="350" y="405" class="note" text-anchor="start">Discarded; nothing changes.</text></g>
<g class="rise" style="animation-delay:2.12s">
<rect x="612" y="536" width="264" height="160" rx="14" class="card win"/>
<path d="M612 570 H876" stroke="#E2E8F0"/>
<circle cx="630" cy="553" r="4" fill="#CBD5E1"/>
<circle cx="644" cy="553" r="4" fill="#CBD5E1"/>
<circle cx="658" cy="553" r="4" fill="#CBD5E1"/>
<text x="744" y="558" class="wintitle" text-anchor="middle">Approvals</text>
</g>
<g class="rise" style="animation-delay:2.62s"><text x="630" y="600" class="rowname" text-anchor="start">Deploy script</text><rect x="630" y="609" width="99" height="22" rx="11" fill="#1A66FF" fill-opacity="0.1"/><circle cx="641" cy="620" r="3.5" fill="#1A66FF" class="blink"/><text x="650" y="624.5" class="state" style="fill:#1A66FF">Recommended</text><path d="M630 643 H858" stroke="#E2E8F0"/></g>
<g class="rise" style="animation-delay:2.97s"><text x="630" y="656" class="rowname" text-anchor="start">Watchdog</text><rect x="630" y="665" width="78" height="22" rx="11" fill="#0F766E" fill-opacity="0.1"/><circle cx="641" cy="676" r="3.5" fill="#0F766E"/><text x="650" y="680.5" class="state" style="fill:#0F766E">Choice 2</text></g>
<g class="rise" style="animation-delay:3.52s"><text x="44" y="728" class="band warn" text-anchor="start">IF IT DOES NOT WORK</text></g>
<g class="rise" style="animation-delay:3.72s"><circle cx="49" cy="754.5" r="4" fill="#B45309"/><text x="62" y="760" class="symptom" text-anchor="start">“shows no sign of struggling”</text><text x="62" y="780" class="note" text-anchor="start">Pick a run that failed, or add --force.</text></g>
<g class="rise" style="animation-delay:3.97s"><circle cx="465" cy="754.5" r="4" fill="#B45309"/><text x="478" y="760" class="symptom" text-anchor="start">“no candidate fix points…”</text><text x="478" y="780" class="note" text-anchor="start">The reviewer found nothing tied to the run.</text></g>
<g class="rise" style="animation-delay:4.22s"><circle cx="49" cy="806.5" r="4" fill="#B45309"/><text x="62" y="812" class="symptom" text-anchor="start">“already asks about this failure”</text><text x="62" y="832" class="note" text-anchor="start">Answer the open card first.</text></g>
<g class="rise" style="animation-delay:4.47s"><circle cx="465" cy="806.5" r="4" fill="#B45309"/><text x="478" y="812" class="symptom" text-anchor="start">Yes does nothing</text><text x="478" y="832" class="note" text-anchor="start">Pick one of the choices first.</text></g>
</svg>
