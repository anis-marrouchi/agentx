<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 736" width="920" height="736" role="img" aria-labelledby="t d" style="--cycle:4.2s">
<title id="t">How work reaches you: Promise, Fact, Reach and Desk</title>
<desc id="d">Six steps in two parts. An agent makes a Promise: who owes what to whom, by when, and the proof that closes it. Proof closes it: a link, a test, an output or a check. Closing writes a Fact: what is true, its source and when it was checked. Each change is recorded on the request or its card. Reach picks the one channel where you were last seen, waits, and tries the next one if you did not see it. You read one list, the Desk, on any surface. Two switches are off by default, and one fix (issue 1214) is merged but not yet proven live.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B0D12" flood-opacity="0.07"/></filter></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B0D12; }
.h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.sub { font-size: 16px; fill: #475569; }
.legend { font-size: 14px; font-weight: 600; }
.band { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; fill: #1A66FF; }
.band.warn { fill: #B45309; }
.title { font-size: 17px; font-weight: 650; }
.note { font-size: 14px; fill: #475569; }
.rowname { font-size: 15px; font-weight: 600; }
.symptom { font-size: 15.5px; font-weight: 650; }
.state { font-size: 12.5px; font-weight: 600; }
.num { font-size: 14.5px; font-weight: 700; fill: #fff; }
.pill { font-size: 13px; font-weight: 700; fill: #fff; }
.wintitle { font-size: 13.5px; font-weight: 600; fill: #475569; }
.card { fill: #fff; stroke: #E2E8F0; stroke-width: 1.25; filter: url(#soft); }
.card.accent { stroke: #C7D9FF; }
.card.win { stroke: #0B0D12; stroke-width: 1.5; }
.link { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100; animation: draw 0.9s ease-in-out backwards; }
.rise { animation: rise 0.55s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade 0.4s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse var(--cycle) ease-out infinite; }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 9% { opacity: 0; transform: scale(1.9); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rise, .fade, .wrap, .pulse, .blink { animation: none; } }
</style>
<rect width="920" height="736" rx="24" fill="#FFFFFF"/>
<text x="44" y="56" class="h1" text-anchor="start">How work reaches you</text>
<text x="44" y="82" class="sub" text-anchor="start">Promise and Fact are the model, Reach the controller, Desk the view.</text>
<circle cx="704" cy="50" r="7" fill="#1A66FF"/><text x="718" y="55" class="legend" text-anchor="start">You, the owner</text>
<circle cx="704" cy="74" r="7" fill="#0B0D12"/><text x="718" y="79" class="legend" text-anchor="start">Your agents</text>
<rect x="20" y="104" width="880" height="216" rx="20" fill="#F3F7FF"/>
<text x="44" y="132" class="band" text-anchor="start">PROMISE AND FACT: THE MODEL</text>
<g class="rise" style="animation-delay:0.32s">
<rect x="44" y="148" width="264" height="152" rx="14" class="card"/>
<circle cx="70" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:4.62s"/>
<circle cx="70" cy="176" r="15" fill="#0B0D12"/>
<text x="70" y="181" class="num" text-anchor="middle">1</text>
<text x="60" y="220" class="title" text-anchor="start">An agent makes</text>
<text x="60" y="241" class="title" text-anchor="start">a Promise</text>
<text x="60" y="263" class="note" text-anchor="start">owner, owed to, due,</text>
<text x="60" y="280" class="note" text-anchor="start">the proof that closes it</text>
</g>
<g class="rise" style="animation-delay:0.64s">
<rect x="328" y="148" width="264" height="152" rx="14" class="card"/>
<circle cx="354" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:5.32s"/>
<circle cx="354" cy="176" r="15" fill="#0B0D12"/>
<text x="354" y="181" class="num" text-anchor="middle">2</text>
<text x="344" y="220" class="title" text-anchor="start">Proof closes it</text>
<text x="344" y="242" class="note" text-anchor="start">a link, a test,</text>
<text x="344" y="259" class="note" text-anchor="start">an output or a check</text>
</g>
<g class="fade" style="animation-delay:0.47s"><path d="M311 224 H323" class="link"/><path d="M319 220 L324 224 L319 228" class="link"/></g>
<g class="rise" style="animation-delay:0.96s">
<rect x="612" y="148" width="264" height="152" rx="14" class="card"/>
<circle cx="638" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:6.02s"/>
<circle cx="638" cy="176" r="15" fill="#0B0D12"/>
<text x="638" y="181" class="num" text-anchor="middle">3</text>
<text x="628" y="220" class="title" text-anchor="start">A Fact is written</text>
<text x="628" y="242" class="note" text-anchor="start">the claim, its source,</text>
<text x="628" y="259" class="note" text-anchor="start">when it was checked</text>
</g>
<g class="fade" style="animation-delay:0.79s"><path d="M595 224 H607" class="link"/><path d="M603 220 L608 224 L603 228" class="link"/></g>
<rect x="20" y="336" width="880" height="216" rx="20" fill="#F6F7F9"/>
<text x="92" y="364" class="band" text-anchor="start">REACH AND DESK: THE CONTROLLER AND THE VIEW</text>
<path d="M744 300 V318 Q744 328 734 328 H80 Q70 328 70 338 V376" class="wrap" pathLength="100" style="animation-delay:1.26s"/>
<path d="M65 371 L70 377 L75 371" class="link fade" style="animation-delay:2.16s"/>
<g class="rise" style="animation-delay:1.28s">
<rect x="44" y="380" width="264" height="152" rx="14" class="card"/>
<circle cx="70" cy="408" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:6.72s"/>
<circle cx="70" cy="408" r="15" fill="#0B0D12"/>
<text x="70" y="413" class="num" text-anchor="middle">4</text>
<text x="60" y="452" class="title" text-anchor="start">The change is</text>
<text x="60" y="473" class="title" text-anchor="start">recorded</text>
<text x="60" y="495" class="note" text-anchor="start">on the request</text>
<text x="60" y="512" class="note" text-anchor="start">or its card</text>
</g>
<g class="rise" style="animation-delay:1.60s">
<rect x="328" y="380" width="264" height="152" rx="14" class="card"/>
<circle cx="354" cy="408" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:7.42s"/>
<circle cx="354" cy="408" r="15" fill="#0B0D12"/>
<text x="354" y="413" class="num" text-anchor="middle">5</text>
<text x="344" y="452" class="title" text-anchor="start">Reach picks</text>
<text x="344" y="473" class="title" text-anchor="start">one channel</text>
<text x="344" y="495" class="note" text-anchor="start">where you were last seen;</text>
<text x="344" y="512" class="note" text-anchor="start">unseen, it tries the next</text>
</g>
<g class="fade" style="animation-delay:1.43s"><path d="M311 456 H323" class="link"/><path d="M319 452 L324 456 L319 460" class="link"/></g>
<g class="rise" style="animation-delay:1.92s">
<rect x="612" y="380" width="264" height="152" rx="14" class="card accent"/>
<circle cx="638" cy="408" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:8.12s"/>
<circle cx="638" cy="408" r="15" fill="#1A66FF"/>
<text x="638" y="413" class="num" text-anchor="middle">6</text>
<text x="628" y="452" class="title" text-anchor="start">You read one list</text>
<text x="628" y="474" class="note" text-anchor="start">the Desk, on the phone,</text>
<text x="628" y="491" class="note" text-anchor="start">the Mac or the dashboard</text>
</g>
<g class="fade" style="animation-delay:1.75s"><path d="M595 456 H607" class="link"/><path d="M603 452 L608 456 L603 460" class="link"/></g>
<g class="rise" style="animation-delay:3.32s"><text x="44" y="596" class="band warn" text-anchor="start">STATUS (EPIC #1138, CLOSED)</text></g>
<g class="rise" style="animation-delay:3.52s"><circle cx="49" cy="622.5" r="4" fill="#B45309"/><text x="62" y="628" class="symptom" text-anchor="start">Urgent ladder is off</text><text x="62" y="648" class="note" text-anchor="start">Your switch: notifications.reach.enabled.</text></g>
<g class="rise" style="animation-delay:3.77s"><circle cx="465" cy="622.5" r="4" fill="#B45309"/><text x="478" y="628" class="symptom" text-anchor="start">Promise catch is off</text><text x="478" y="648" class="note" text-anchor="start">Your switch: requests.catchPromises.enabled.</text></g>
<g class="rise" style="animation-delay:4.02s"><circle cx="49" cy="674.5" r="4" fill="#B45309"/><text x="62" y="680" class="symptom" text-anchor="start">Due work: fix not proven</text><text x="62" y="700" class="note" text-anchor="start">Fixed in #1218, not yet proven live.</text></g>
<g class="rise" style="animation-delay:4.27s"><circle cx="465" cy="674.5" r="4" fill="#B45309"/><text x="478" y="680" class="symptom" text-anchor="start">Steps C, D and F shipped</text><text x="478" y="700" class="note" text-anchor="start">See the table below for each step.</text></g>
</svg>
