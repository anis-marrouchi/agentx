<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 820" width="920" height="820" role="img" aria-labelledby="t d" style="--cycle:4.2s">
<title id="t">What leaves your machine</title>
<desc id="d">Three steps, then three optional features. Every time an agent works: you send a message, AgentX on your machine adds the agent's instructions and the files it needs, and the model provider reads all of it and writes the reply. Only for features you turn on: your voice goes to ElevenLabs when a key is set, screen and camera pictures go to the model or a vision service, and phone notifications pass through your phone browser's push service. The demo is the exception: its replies are scripted and nothing leaves the computer.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B0D12" flood-opacity="0.07"/></filter></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B0D12; }
.h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.sub { font-size: 16px; fill: #475569; }
.legend { font-size: 14px; font-weight: 600; }
.band { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; fill: #1A66FF; }
.band.warn { fill: #B45309; }
.title { font-size: 17px; font-weight: 650; }
.note { font-size: 14px; fill: #475569; }
.rowname { font-size: 15px; font-weight: 600; }
.symptom { font-size: 15.5px; font-weight: 650; }
.state { font-size: 12.5px; font-weight: 600; }
.num { font-size: 14.5px; font-weight: 700; fill: #fff; }
.pill { font-size: 13px; font-weight: 700; fill: #fff; }
.wintitle { font-size: 13.5px; font-weight: 600; fill: #475569; }
.card { fill: #fff; stroke: #E2E8F0; stroke-width: 1.25; filter: url(#soft); }
.card.accent { stroke: #C7D9FF; }
.card.win { stroke: #0B0D12; stroke-width: 1.5; }
.link { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100; animation: draw 0.9s ease-in-out backwards; }
.rise { animation: rise 0.55s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade 0.4s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse var(--cycle) ease-out infinite; }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 9% { opacity: 0; transform: scale(1.9); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rise, .fade, .wrap, .pulse, .blink { animation: none; } }
</style>
<rect width="920" height="820" rx="24" fill="#FFFFFF"/>
<text x="44" y="56" class="h1" text-anchor="start">What leaves your machine</text>
<text x="44" y="82" class="sub" text-anchor="start">AgentX runs on your machine. The model that writes the replies does not.</text>
<circle cx="704" cy="50" r="7" fill="#1A66FF"/><text x="718" y="55" class="legend" text-anchor="start">You</text>
<circle cx="704" cy="74" r="7" fill="#0B0D12"/><text x="718" y="79" class="legend" text-anchor="start">AgentX and services</text>
<rect x="20" y="104" width="880" height="200" rx="20" fill="#F3F7FF"/>
<text x="44" y="132" class="band" text-anchor="start">EVERY TIME AN AGENT WORKS</text>
<g class="rise" style="animation-delay:0.32s">
<rect x="44" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:4.62s"/>
<circle cx="70" cy="176" r="15" fill="#1A66FF"/>
<text x="70" y="181" class="num" text-anchor="middle">1</text>
<text x="60" y="220" class="title" text-anchor="start">You send a message</text>
<text x="60" y="242" class="note" text-anchor="start">from a chat app, the dashboard</text>
<text x="60" y="259" class="note" text-anchor="start">or the phone app</text>
</g>
<g class="rise" style="animation-delay:0.64s">
<rect x="328" y="148" width="264" height="136" rx="14" class="card"/>
<circle cx="354" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:5.32s"/>
<circle cx="354" cy="176" r="15" fill="#0B0D12"/>
<text x="354" y="181" class="num" text-anchor="middle">2</text>
<text x="344" y="220" class="title" text-anchor="start">AgentX adds what</text>
<text x="344" y="241" class="title" text-anchor="start">the agent needs</text>
<text x="344" y="263" class="note" text-anchor="start">instructions, chat, files</text>
</g>
<g class="fade" style="animation-delay:0.47s"><path d="M311 216 H323" class="link"/><path d="M319 212 L324 216 L319 220" class="link"/></g>
<g class="rise" style="animation-delay:0.96s">
<rect x="612" y="148" width="264" height="136" rx="14" class="card"/>
<circle cx="638" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:6.02s"/>
<circle cx="638" cy="176" r="15" fill="#0B0D12"/>
<text x="638" y="181" class="num" text-anchor="middle">3</text>
<text x="628" y="220" class="title" text-anchor="start">The model provider</text>
<text x="628" y="241" class="title" text-anchor="start">writes the reply</text>
<text x="628" y="263" class="note" text-anchor="start">it reads all of it, online</text>
</g>
<g class="fade" style="animation-delay:0.79s"><path d="M595 216 H607" class="link"/><path d="M603 212 L608 216 L603 220" class="link"/></g>
<rect x="20" y="320" width="880" height="200" rx="20" fill="#F6F7F9"/>
<text x="92" y="348" class="band" text-anchor="start">ONLY FOR WHAT YOU TURN ON</text>
<path d="M744 284 V302 Q744 312 734 312 H80 Q70 312 70 322 V360" class="wrap" pathLength="100" style="animation-delay:1.26s"/>
<path d="M65 355 L70 361 L75 355" class="link fade" style="animation-delay:2.16s"/>
<g class="rise" style="animation-delay:1.28s">
<rect x="44" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:6.72s"/>
<circle cx="70" cy="392" r="15" fill="#0B0D12"/>
<text x="70" y="397" class="num" text-anchor="middle">4</text>
<text x="60" y="436" class="title" text-anchor="start">Your voice</text>
<text x="60" y="458" class="note" text-anchor="start">to ElevenLabs when a key is set;</text>
<text x="60" y="475" class="note" text-anchor="start">voice.stt: local keeps it here</text>
</g>
<g class="rise" style="animation-delay:1.60s">
<rect x="328" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="354" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:7.42s"/>
<circle cx="354" cy="392" r="15" fill="#0B0D12"/>
<text x="354" y="397" class="num" text-anchor="middle">5</text>
<text x="344" y="436" class="title" text-anchor="start">Screen and camera</text>
<text x="344" y="457" class="title" text-anchor="start">pictures</text>
<text x="344" y="479" class="note" text-anchor="start">to the model or a vision service</text>
</g>
<g class="rise" style="animation-delay:1.92s">
<rect x="612" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="638" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:8.12s"/>
<circle cx="638" cy="392" r="15" fill="#0B0D12"/>
<text x="638" y="397" class="num" text-anchor="middle">6</text>
<text x="628" y="436" class="title" text-anchor="start">Phone notifications</text>
<text x="628" y="458" class="note" text-anchor="start">through your phone</text>
<text x="628" y="475" class="note" text-anchor="start">browser's push service</text>
</g>
<g class="rise" style="animation-delay:2.32s"><rect x="44" y="536" width="528" height="68" rx="14" class="card"/><rect x="44" y="536" width="6" height="68" rx="3" fill="#0F766E"/><text x="66" y="565" class="title" text-anchor="start">The demo sends nothing out</text><text x="66" y="587" class="note" text-anchor="start">Its replies are scripted: no model account, no provider.</text></g>
<g class="rise" style="animation-delay:3.12s"><text x="44" y="660" class="band warn" text-anchor="start">TO KEEP SOMETHING ON YOUR MACHINE</text></g>
<g class="rise" style="animation-delay:3.32s"><circle cx="49" cy="686.5" r="4" fill="#B45309"/><text x="62" y="692" class="symptom" text-anchor="start">Secrets and private files</text><text x="62" y="712" class="note" text-anchor="start">Keep them out of the agent's workspace.</text></g>
<g class="rise" style="animation-delay:3.57s"><circle cx="465" cy="686.5" r="4" fill="#B45309"/><text x="478" y="692" class="symptom" text-anchor="start">Your voice</text><text x="478" y="712" class="note" text-anchor="start">Set voice.stt to local.</text></g>
<g class="rise" style="animation-delay:3.82s"><circle cx="49" cy="738.5" r="4" fill="#B45309"/><text x="62" y="744" class="symptom" text-anchor="start">Pictures</text><text x="62" y="764" class="note" text-anchor="start">Don't share the screen or camera.</text></g>
<g class="rise" style="animation-delay:4.07s"><circle cx="465" cy="738.5" r="4" fill="#B45309"/><text x="478" y="744" class="symptom" text-anchor="start">The whole conversation</text><text x="478" y="764" class="note" text-anchor="start">Use a model that runs on your machine.</text></g>
</svg>
