<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 950" width="920" height="950" role="img" aria-labelledby="t d" style="--cycle:4.2s">
<title id="t">How the weekly quality report reaches the epic issue</title>
<desc id="d">Six steps in two parts. Every Monday the daemon runs the quality report for the week that just ended. It checks the text holds no cost amounts and no names, then posts one comment on the epic issue, or edits that week's comment if it is already there. A failure is written to the daemon log and tried again every hour. After week 3 with the gates on, the comment says the verdict is due. You run agentx quality verdict with keep, tune or switch-off for each gate, and it posts one verdict comment that cites the latest numbers.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B0D12" flood-opacity="0.07"/></filter></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B0D12; }
.h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.sub { font-size: 16px; fill: #475569; }
.legend { font-size: 14px; font-weight: 600; }
.band { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; fill: #1A66FF; }
.band.warn { fill: #B45309; }
.title { font-size: 17px; font-weight: 650; }
.note { font-size: 14px; fill: #475569; }
.rowname { font-size: 15px; font-weight: 600; }
.symptom { font-size: 15.5px; font-weight: 650; }
.state { font-size: 12.5px; font-weight: 600; }
.num { font-size: 14.5px; font-weight: 700; fill: #fff; }
.pill { font-size: 13px; font-weight: 700; fill: #fff; }
.wintitle { font-size: 13.5px; font-weight: 600; fill: #475569; }
.card { fill: #fff; stroke: #E2E8F0; stroke-width: 1.25; filter: url(#soft); }
.card.accent { stroke: #C7D9FF; }
.card.win { stroke: #0B0D12; stroke-width: 1.5; }
.link { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100; animation: draw 0.9s ease-in-out backwards; }
.rise { animation: rise 0.55s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade 0.4s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse var(--cycle) ease-out infinite; }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 9% { opacity: 0; transform: scale(1.9); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rise, .fade, .wrap, .pulse, .blink { animation: none; } }
</style>
<rect width="920" height="950" rx="24" fill="#FFFFFF"/>
<text x="44" y="56" class="h1" text-anchor="start">How the weekly quality report reaches the epic issue</text>
<text x="44" y="82" class="sub" text-anchor="start">One comment a week. The verdict is yours.</text>
<circle cx="704" cy="50" r="7" fill="#1A66FF"/><text x="718" y="55" class="legend" text-anchor="start">You, the owner</text>
<circle cx="704" cy="74" r="7" fill="#0B0D12"/><text x="718" y="79" class="legend" text-anchor="start">The AgentX daemon</text>
<rect x="20" y="104" width="880" height="372" rx="20" fill="#F6F7F9"/>
<text x="44" y="132" class="band" text-anchor="start">EVERY MONDAY</text>
<g class="rise" style="animation-delay:0.32s">
<rect x="44" y="148" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:4.62s"/>
<circle cx="70" cy="176" r="15" fill="#0B0D12"/>
<text x="70" y="181" class="num" text-anchor="middle">1</text>
<text x="60" y="220" class="title" text-anchor="start">Run the report</text>
<text x="60" y="241" class="title" text-anchor="start">for last week</text>
<text x="60" y="263" class="note" text-anchor="start">Monday at the set time,</text>
<text x="60" y="280" class="note" text-anchor="start">or later that week</text>
</g>
<g class="rise" style="animation-delay:0.64s">
<rect x="328" y="148" width="264" height="136" rx="14" class="card"/>
<circle cx="354" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:5.32s"/>
<circle cx="354" cy="176" r="15" fill="#0B0D12"/>
<text x="354" y="181" class="num" text-anchor="middle">2</text>
<text x="344" y="220" class="title" text-anchor="start">Check it is</text>
<text x="344" y="241" class="title" text-anchor="start">safe to publish</text>
<text x="344" y="263" class="note" text-anchor="start">no cost amounts,</text>
<text x="344" y="280" class="note" text-anchor="start">no names</text>
</g>
<g class="fade" style="animation-delay:0.47s"><path d="M311 216 H323" class="link"/><path d="M319 212 L324 216 L319 220" class="link"/></g>
<g class="rise" style="animation-delay:0.96s">
<rect x="612" y="148" width="264" height="136" rx="14" class="card"/>
<circle cx="638" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:6.02s"/>
<circle cx="638" cy="176" r="15" fill="#0B0D12"/>
<text x="638" y="181" class="num" text-anchor="middle">3</text>
<text x="628" y="220" class="title" text-anchor="start">Post one comment</text>
<text x="628" y="241" class="title" text-anchor="start">on the epic issue</text>
<text x="628" y="263" class="note" text-anchor="start">the same week again</text>
<text x="628" y="280" class="note" text-anchor="start">edits that comment</text>
</g>
<g class="fade" style="animation-delay:0.79s"><path d="M595 216 H607" class="link"/><path d="M603 212 L608 216 L603 220" class="link"/></g>
<path d="M744 284 V292 Q744 302 734 302 H80 Q70 302 70 312 V316" class="wrap" pathLength="100" style="animation-delay:1.26s"/>
<path d="M65 311 L70 317 L75 311" class="link fade" style="animation-delay:2.16s"/>
<g class="rise" style="animation-delay:1.28s">
<rect x="44" y="320" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="348" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:6.72s"/>
<circle cx="70" cy="348" r="15" fill="#0B0D12"/>
<text x="70" y="353" class="num" text-anchor="middle">4</text>
<text x="60" y="392" class="title" text-anchor="start">After week 3:</text>
<text x="60" y="413" class="title" text-anchor="start">verdict due</text>
<text x="60" y="435" class="note" text-anchor="start">the comment says so</text>
</g>
<rect x="20" y="492" width="880" height="386" rx="20" fill="#F3F7FF"/>
<text x="92" y="520" class="band" text-anchor="start">AFTER WEEK 3</text>
<path d="M176 456 V474 Q176 484 166 484 H80 Q70 484 70 494 V532" class="wrap" pathLength="100" style="animation-delay:1.58s"/>
<path d="M65 527 L70 533 L75 527" class="link fade" style="animation-delay:2.48s"/>
<g class="rise" style="animation-delay:1.60s">
<rect x="44" y="536" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="564" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:7.42s"/>
<circle cx="70" cy="564" r="15" fill="#1A66FF"/>
<text x="70" y="569" class="num" text-anchor="middle">5</text>
<text x="60" y="608" class="title" text-anchor="start">Decide each gate</text>
<text x="60" y="630" class="note" text-anchor="start">keep, tune or</text>
<text x="60" y="647" class="note" text-anchor="start">switch-off</text>
</g>
<g class="rise" style="animation-delay:1.92s">
<rect x="328" y="536" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="564" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:8.12s"/>
<circle cx="354" cy="564" r="15" fill="#1A66FF"/>
<text x="354" y="569" class="num" text-anchor="middle">6</text>
<text x="344" y="608" class="title" text-anchor="start">Post the verdict</text>
<text x="344" y="630" class="note" text-anchor="start">one comment with</text>
<text x="344" y="647" class="note" text-anchor="start">the latest numbers</text>
</g>
<g class="fade" style="animation-delay:1.75s"><path d="M311 604 H323" class="link"/><path d="M319 600 L324 604 L319 608" class="link"/></g>
<g class="rise" style="animation-delay:2.32s"><rect x="328" y="354" width="264" height="68" rx="14" class="card"/><rect x="328" y="354" width="6" height="68" rx="3" fill="#DC2626"/><text x="350" y="383" class="title" text-anchor="start">It fails</text><text x="350" y="405" class="note" text-anchor="start">Logged, tried again hourly.</text></g>
<g class="rise" style="animation-delay:2.12s">
<rect x="612" y="536" width="264" height="160" rx="14" class="card win"/>
<path d="M612 570 H876" stroke="#E2E8F0"/>
<circle cx="630" cy="553" r="4" fill="#CBD5E1"/>
<circle cx="644" cy="553" r="4" fill="#CBD5E1"/>
<circle cx="658" cy="553" r="4" fill="#CBD5E1"/>
<text x="744" y="558" class="wintitle" text-anchor="middle">Epic issue</text>
</g>
<g class="rise" style="animation-delay:2.62s"><text x="630" y="600" class="rowname" text-anchor="start">Report 2026-W42</text><rect x="630" y="609" width="65" height="22" rx="11" fill="#1A66FF" fill-opacity="0.1"/><circle cx="641" cy="620" r="3.5" fill="#1A66FF" class="blink"/><text x="650" y="624.5" class="state" style="fill:#1A66FF">Posted</text><path d="M630 643 H858" stroke="#E2E8F0"/></g>
<g class="rise" style="animation-delay:2.97s"><text x="630" y="656" class="rowname" text-anchor="start">Verdict</text><rect x="630" y="665" width="44" height="22" rx="11" fill="#0F766E" fill-opacity="0.1"/><circle cx="641" cy="676" r="3.5" fill="#0F766E"/><text x="650" y="680.5" class="state" style="fill:#0F766E">Due</text></g>
<g class="rise" style="animation-delay:3.52s"><text x="44" y="728" class="band warn" text-anchor="start">IF IT DOES NOT WORK</text></g>
<g class="rise" style="animation-delay:3.72s"><circle cx="49" cy="754.5" r="4" fill="#B45309"/><text x="62" y="760" class="symptom" text-anchor="start">“FAILED … cost amount”</text><text x="62" y="780" class="note" text-anchor="start">The report printed an amount. Fix the report.</text></g>
<g class="rise" style="animation-delay:3.97s"><circle cx="465" cy="754.5" r="4" fill="#B45309"/><text x="478" y="760" class="symptom" text-anchor="start">“no GitHub token”</text><text x="478" y="780" class="note" text-anchor="start">Set channels.github.token.</text></g>
<g class="rise" style="animation-delay:4.22s"><circle cx="49" cy="806.5" r="4" fill="#B45309"/><text x="62" y="812" class="symptom" text-anchor="start">“No report was posted for …”</text><text x="62" y="832" class="note" text-anchor="start">Run agentx quality weekly --week.</text></g>
<g class="rise" style="animation-delay:4.47s"><circle cx="465" cy="806.5" r="4" fill="#B45309"/><text x="478" y="812" class="symptom" text-anchor="start">“no verdict for: …”</text><text x="478" y="832" class="note" text-anchor="start">Give every gate a --gate.</text></g>
</svg>
