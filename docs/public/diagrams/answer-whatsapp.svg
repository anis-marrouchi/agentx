<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 900" width="920" height="900" role="img" aria-labelledby="t d" style="--cycle:4.9s">
<title id="t">How an agent answers customers on WhatsApp</title>
<desc id="d">Seven steps in two parts. You set it up once: get a separate WhatsApp number, pair it with AgentX by scanning a QR code, then list the customers who may write. Then, for every message: a customer writes to that number, AgentX checks the list, the agent writes an answer, and the answer goes back at once, in the same chat, with no approval step. A message from a number that is not on the list is ignored.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B0D12" flood-opacity="0.07"/></filter></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B0D12; }
.h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.sub { font-size: 16px; fill: #475569; }
.legend { font-size: 14px; font-weight: 600; }
.band { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; fill: #1A66FF; }
.band.warn { fill: #B45309; }
.title { font-size: 17px; font-weight: 650; }
.note { font-size: 14px; fill: #475569; }
.rowname { font-size: 15px; font-weight: 600; }
.symptom { font-size: 15.5px; font-weight: 650; }
.state { font-size: 12.5px; font-weight: 600; }
.num { font-size: 14.5px; font-weight: 700; fill: #fff; }
.pill { font-size: 13px; font-weight: 700; fill: #fff; }
.wintitle { font-size: 13.5px; font-weight: 600; fill: #475569; }
.card { fill: #fff; stroke: #E2E8F0; stroke-width: 1.25; filter: url(#soft); }
.card.accent { stroke: #C7D9FF; }
.card.win { stroke: #0B0D12; stroke-width: 1.5; }
.link { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100; animation: draw 0.9s ease-in-out backwards; }
.rise { animation: rise 0.55s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade 0.4s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse var(--cycle) ease-out infinite; }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 9% { opacity: 0; transform: scale(1.9); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rise, .fade, .wrap, .pulse, .blink { animation: none; } }
</style>
<rect width="920" height="900" rx="24" fill="#FFFFFF"/>
<text x="44" y="56" class="h1" text-anchor="start">How the agent answers on WhatsApp</text>
<text x="44" y="82" class="sub" text-anchor="start">You set it up once. After that, the agent replies on its own.</text>
<circle cx="704" cy="50" r="7" fill="#1A66FF"/><text x="718" y="55" class="legend" text-anchor="start">You</text>
<circle cx="704" cy="74" r="7" fill="#0B0D12"/><text x="718" y="79" class="legend" text-anchor="start">The customer and AgentX</text>
<rect x="20" y="104" width="880" height="200" rx="20" fill="#F3F7FF"/>
<text x="44" y="132" class="band" text-anchor="start">YOU SET IT UP ONCE</text>
<g class="rise" style="animation-delay:0.32s">
<rect x="44" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:4.94s"/>
<circle cx="70" cy="176" r="15" fill="#1A66FF"/>
<text x="70" y="181" class="num" text-anchor="middle">1</text>
<text x="60" y="220" class="title" text-anchor="start">Get a spare number</text>
<text x="60" y="242" class="note" text-anchor="start">a second phone or SIM,</text>
<text x="60" y="259" class="note" text-anchor="start">not your personal number</text>
</g>
<g class="rise" style="animation-delay:0.64s">
<rect x="328" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:5.64s"/>
<circle cx="354" cy="176" r="15" fill="#1A66FF"/>
<text x="354" y="181" class="num" text-anchor="middle">2</text>
<text x="344" y="220" class="title" text-anchor="start">Pair it with AgentX</text>
<text x="344" y="242" class="note" text-anchor="start">agentx connect whatsapp,</text>
<text x="344" y="259" class="note" text-anchor="start">then scan the QR code</text>
</g>
<g class="fade" style="animation-delay:0.47s"><path d="M311 216 H323" class="link"/><path d="M319 212 L324 216 L319 220" class="link"/></g>
<g class="rise" style="animation-delay:0.96s">
<rect x="612" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="638" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:6.34s"/>
<circle cx="638" cy="176" r="15" fill="#1A66FF"/>
<text x="638" y="181" class="num" text-anchor="middle">3</text>
<text x="628" y="220" class="title" text-anchor="start">List who may write</text>
<text x="628" y="242" class="note" text-anchor="start">the allow-list: customers'</text>
<text x="628" y="259" class="note" text-anchor="start">phone numbers</text>
</g>
<g class="fade" style="animation-delay:0.79s"><path d="M595 216 H607" class="link"/><path d="M603 212 L608 216 L603 220" class="link"/></g>
<rect x="20" y="320" width="880" height="372" rx="20" fill="#F6F7F9"/>
<text x="92" y="348" class="band" text-anchor="start">THEN, FOR EVERY MESSAGE</text>
<path d="M744 284 V302 Q744 312 734 312 H80 Q70 312 70 322 V360" class="wrap" pathLength="100" style="animation-delay:1.26s"/>
<path d="M65 355 L70 361 L75 355" class="link fade" style="animation-delay:2.16s"/>
<g class="rise" style="animation-delay:1.28s">
<rect x="44" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:7.04s"/>
<circle cx="70" cy="392" r="15" fill="#0B0D12"/>
<text x="70" y="397" class="num" text-anchor="middle">4</text>
<text x="60" y="436" class="title" text-anchor="start">A customer writes</text>
<text x="60" y="458" class="note" text-anchor="start">to the separate number</text>
</g>
<g class="rise" style="animation-delay:1.60s">
<rect x="328" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="354" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:7.74s"/>
<circle cx="354" cy="392" r="15" fill="#0B0D12"/>
<text x="354" y="397" class="num" text-anchor="middle">5</text>
<text x="344" y="436" class="title" text-anchor="start">AgentX checks the list</text>
<text x="344" y="458" class="note" text-anchor="start">numbers not on it</text>
<text x="344" y="475" class="note" text-anchor="start">are ignored</text>
</g>
<g class="fade" style="animation-delay:1.43s"><path d="M311 432 H323" class="link"/><path d="M319 428 L324 432 L319 436" class="link"/></g>
<g class="rise" style="animation-delay:1.92s">
<rect x="612" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="638" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:8.44s"/>
<circle cx="638" cy="392" r="15" fill="#0B0D12"/>
<text x="638" y="397" class="num" text-anchor="middle">6</text>
<text x="628" y="436" class="title" text-anchor="start">The agent answers</text>
<text x="628" y="458" class="note" text-anchor="start">with its own instructions</text>
<text x="628" y="475" class="note" text-anchor="start">and tools</text>
</g>
<g class="fade" style="animation-delay:1.75s"><path d="M595 432 H607" class="link"/><path d="M603 428 L608 432 L603 436" class="link"/></g>
<path d="M744 500 V508 Q744 518 734 518 H80 Q70 518 70 528 V532" class="wrap" pathLength="100" style="animation-delay:2.22s"/>
<path d="M65 527 L70 533 L75 527" class="link fade" style="animation-delay:3.12s"/>
<g class="rise" style="animation-delay:2.24s">
<rect x="44" y="536" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="564" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:9.14s"/>
<circle cx="70" cy="564" r="15" fill="#0B0D12"/>
<text x="70" y="569" class="num" text-anchor="middle">7</text>
<text x="60" y="608" class="title" text-anchor="start">The reply goes out</text>
<text x="60" y="630" class="note" text-anchor="start">at once, in the same chat,</text>
<text x="60" y="647" class="note" text-anchor="start">with no approval</text>
</g>
<g class="rise" style="animation-delay:2.64s"><rect x="328" y="570" width="264" height="68" rx="14" class="card"/><rect x="328" y="570" width="6" height="68" rx="3" fill="#DC2626"/><text x="350" y="599" class="title" text-anchor="start">Not on the list</text><text x="350" y="621" class="note" text-anchor="start">Nothing is read or answered.</text></g>
<g class="rise" style="animation-delay:2.44s">
<rect x="612" y="524" width="264" height="160" rx="14" class="card win"/>
<path d="M612 558 H876" stroke="#E2E8F0"/>
<circle cx="630" cy="541" r="4" fill="#CBD5E1"/>
<circle cx="644" cy="541" r="4" fill="#CBD5E1"/>
<circle cx="658" cy="541" r="4" fill="#CBD5E1"/>
<text x="744" y="546" class="wintitle" text-anchor="middle">WhatsApp</text>
</g>
<g class="rise" style="animation-delay:2.94s"><text x="630" y="588" class="rowname" text-anchor="start">Open on Saturday?</text><rect x="630" y="597" width="78" height="22" rx="11" fill="#0B0D12" fill-opacity="0.1"/><circle cx="641" cy="608" r="3.5" fill="#0B0D12" class="blink"/><text x="650" y="612.5" class="state" style="fill:#0B0D12">Customer</text><path d="M630 631 H858" stroke="#E2E8F0"/></g>
<g class="rise" style="animation-delay:3.29s"><text x="630" y="644" class="rowname" text-anchor="start">Yes, 9:00 to 13:00.</text><rect x="630" y="653" width="65" height="22" rx="11" fill="#1A66FF" fill-opacity="0.1"/><circle cx="641" cy="664" r="3.5" fill="#1A66FF"/><text x="650" y="668.5" class="state" style="fill:#1A66FF">Helper</text></g>
<g class="rise" style="animation-delay:3.84s"><text x="44" y="728" class="band warn" text-anchor="start">IF IT DOES NOT WORK</text></g>
<g class="rise" style="animation-delay:4.04s"><circle cx="49" cy="754.5" r="4" fill="#B45309"/><text x="62" y="760" class="symptom" text-anchor="start">No QR code appears</text><text x="62" y="780" class="note" text-anchor="start">Stop the daemon, then pair again.</text></g>
<g class="rise" style="animation-delay:4.29s"><circle cx="465" cy="754.5" r="4" fill="#B45309"/><text x="478" y="760" class="symptom" text-anchor="start">The customer gets no answer</text><text x="478" y="780" class="note" text-anchor="start">Add their number to the allow-list.</text></g>
<g class="rise" style="animation-delay:4.54s"><circle cx="49" cy="806.5" r="4" fill="#B45309"/><text x="62" y="812" class="symptom" text-anchor="start">It answers everyone</text><text x="62" y="832" class="note" text-anchor="start">The allow-list is empty: fill it.</text></g>
<g class="rise" style="animation-delay:4.79s"><circle cx="465" cy="806.5" r="4" fill="#B45309"/><text x="478" y="812" class="symptom" text-anchor="start">“Logged out” in the log</text><text x="478" y="832" class="note" text-anchor="start">Delete the session folder, pair again.</text></g>
</svg>
