<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 870" width="920" height="870" role="img" aria-labelledby="t d" style="--cycle:4.9s">
<title id="t">How spec tests reach a pull request</title>
<desc id="d">Seven steps in two parts. An issue that names a pilot path, such as src/daemon, arrives and goes to a Claude cloud session. At the same time AgentX starts a separate test agent on a clean copy of the repository, with the issue text only. The test agent writes a test file; AgentX commits it under the test agent's name and pushes it to the spec-tests branch. The coding session merges that branch, runs the tests, and records in the pull request which failures were code defects and which were test misreads. When the budget runs out, the test agent stops and a note is left on the issue.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B0D12" flood-opacity="0.07"/></filter></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B0D12; }
.h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.sub { font-size: 16px; fill: #475569; }
.legend { font-size: 14px; font-weight: 600; }
.band { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; fill: #1A66FF; }
.band.warn { fill: #B45309; }
.title { font-size: 17px; font-weight: 650; }
.note { font-size: 14px; fill: #475569; }
.rowname { font-size: 15px; font-weight: 600; }
.symptom { font-size: 15.5px; font-weight: 650; }
.state { font-size: 12.5px; font-weight: 600; }
.num { font-size: 14.5px; font-weight: 700; fill: #fff; }
.pill { font-size: 13px; font-weight: 700; fill: #fff; }
.wintitle { font-size: 13.5px; font-weight: 600; fill: #475569; }
.card { fill: #fff; stroke: #E2E8F0; stroke-width: 1.25; filter: url(#soft); }
.card.accent { stroke: #C7D9FF; }
.card.win { stroke: #0B0D12; stroke-width: 1.5; }
.link { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100; animation: draw 0.9s ease-in-out backwards; }
.rise { animation: rise 0.55s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade 0.4s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse var(--cycle) ease-out infinite; }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 9% { opacity: 0; transform: scale(1.9); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rise, .fade, .wrap, .pulse, .blink { animation: none; } }
</style>
<rect width="920" height="870" rx="24" fill="#FFFFFF"/>
<text x="44" y="56" class="h1" text-anchor="start">How spec tests reach a pull request</text>
<text x="44" y="82" class="sub" text-anchor="start">Two agents, one issue. The test agent never sees the code.</text>
<circle cx="704" cy="50" r="7" fill="#1A66FF"/><text x="718" y="55" class="legend" text-anchor="start">The coding agent</text>
<circle cx="704" cy="74" r="7" fill="#0B0D12"/><text x="718" y="79" class="legend" text-anchor="start">The test agent and AgentX</text>
<rect x="20" y="104" width="880" height="200" rx="20" fill="#F6F7F9"/>
<text x="44" y="132" class="band" text-anchor="start">AN ISSUE ARRIVES</text>
<g class="rise" style="animation-delay:0.32s">
<rect x="44" y="148" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:4.94s"/>
<circle cx="70" cy="176" r="15" fill="#0B0D12"/>
<text x="70" y="181" class="num" text-anchor="middle">1</text>
<text x="60" y="220" class="title" text-anchor="start">An issue names</text>
<text x="60" y="241" class="title" text-anchor="start">a pilot path</text>
<text x="60" y="263" class="note" text-anchor="start">for example src/daemon</text>
</g>
<g class="rise" style="animation-delay:0.64s">
<rect x="328" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:5.64s"/>
<circle cx="354" cy="176" r="15" fill="#1A66FF"/>
<text x="354" y="181" class="num" text-anchor="middle">2</text>
<text x="344" y="220" class="title" text-anchor="start">A cloud session</text>
<text x="344" y="241" class="title" text-anchor="start">writes the code</text>
<text x="344" y="263" class="note" text-anchor="start">the coding agent, as before</text>
</g>
<g class="fade" style="animation-delay:0.47s"><path d="M311 216 H323" class="link"/><path d="M319 212 L324 216 L319 220" class="link"/></g>
<g class="rise" style="animation-delay:0.96s">
<rect x="612" y="148" width="264" height="136" rx="14" class="card"/>
<circle cx="638" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:6.34s"/>
<circle cx="638" cy="176" r="15" fill="#0B0D12"/>
<text x="638" y="181" class="num" text-anchor="middle">3</text>
<text x="628" y="220" class="title" text-anchor="start">The test agent writes</text>
<text x="628" y="241" class="title" text-anchor="start">tests at the same time</text>
<text x="628" y="263" class="note" text-anchor="start">clean copy, issue text only,</text>
<text x="628" y="280" class="note" text-anchor="start">no shell, no network</text>
</g>
<g class="fade" style="animation-delay:0.79s"><path d="M595 216 H607" class="link"/><path d="M603 212 L608 216 L603 220" class="link"/></g>
<rect x="20" y="320" width="880" height="372" rx="20" fill="#F3F7FF"/>
<text x="92" y="348" class="band" text-anchor="start">TESTS MEET THE CODE</text>
<path d="M744 284 V302 Q744 312 734 312 H80 Q70 312 70 322 V360" class="wrap" pathLength="100" style="animation-delay:1.26s"/>
<path d="M65 355 L70 361 L75 355" class="link fade" style="animation-delay:2.16s"/>
<g class="rise" style="animation-delay:1.28s">
<rect x="44" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:7.04s"/>
<circle cx="70" cy="392" r="15" fill="#0B0D12"/>
<text x="70" y="397" class="num" text-anchor="middle">4</text>
<text x="60" y="436" class="title" text-anchor="start">AgentX commits and pushes</text>
<text x="60" y="458" class="note" text-anchor="start">test: spec tests for #N</text>
<text x="60" y="475" class="note" text-anchor="start">to spec-tests/issue-N</text>
</g>
<g class="rise" style="animation-delay:1.60s">
<rect x="328" y="364" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="392" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:7.74s"/>
<circle cx="354" cy="392" r="15" fill="#1A66FF"/>
<text x="354" y="397" class="num" text-anchor="middle">5</text>
<text x="344" y="436" class="title" text-anchor="start">The session merges</text>
<text x="344" y="457" class="title" text-anchor="start">the branch</text>
<text x="344" y="479" class="note" text-anchor="start">the commit keeps the</text>
<text x="344" y="496" class="note" text-anchor="start">test agent as its author</text>
</g>
<g class="fade" style="animation-delay:1.43s"><path d="M311 432 H323" class="link"/><path d="M319 428 L324 432 L319 436" class="link"/></g>
<path d="M460 500 V508 Q460 518 450 518 H80 Q70 518 70 528 V532" class="wrap" pathLength="100" style="animation-delay:1.90s"/>
<path d="M65 527 L70 533 L75 527" class="link fade" style="animation-delay:2.80s"/>
<g class="rise" style="animation-delay:1.92s">
<rect x="44" y="536" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="564" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:8.44s"/>
<circle cx="70" cy="564" r="15" fill="#1A66FF"/>
<text x="70" y="569" class="num" text-anchor="middle">6</text>
<text x="60" y="608" class="title" text-anchor="start">A failing spec test</text>
<text x="60" y="629" class="title" text-anchor="start">is a finding</text>
<text x="60" y="651" class="note" text-anchor="start">fix the code, or show</text>
<text x="60" y="668" class="note" text-anchor="start">the test misreads the issue</text>
</g>
<g class="rise" style="animation-delay:2.24s">
<rect x="328" y="536" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="564" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:9.14s"/>
<circle cx="354" cy="564" r="15" fill="#1A66FF"/>
<text x="354" y="569" class="num" text-anchor="middle">7</text>
<text x="344" y="608" class="title" text-anchor="start">The pull request</text>
<text x="344" y="629" class="title" text-anchor="start">records the call</text>
<text x="344" y="651" class="note" text-anchor="start">written, failed, code defects,</text>
<text x="344" y="668" class="note" text-anchor="start">test misreads</text>
</g>
<g class="fade" style="animation-delay:2.07s"><path d="M311 604 H323" class="link"/><path d="M319 600 L324 604 L319 608" class="link"/></g>
<g class="rise" style="animation-delay:2.64s"><rect x="612" y="398" width="264" height="68" rx="14" class="card"/><rect x="612" y="398" width="6" height="68" rx="3" fill="#DC2626"/><text x="634" y="427" class="title" text-anchor="start">The budget runs out</text><text x="634" y="449" class="note" text-anchor="start">It stops and leaves a note.</text></g>
<g class="rise" style="animation-delay:3.84s"><text x="44" y="728" class="band warn" text-anchor="start">IF IT DOES NOT WORK</text></g>
<g class="rise" style="animation-delay:4.04s"><circle cx="49" cy="754.5" r="4" fill="#B45309"/><text x="62" y="760" class="symptom" text-anchor="start">No spec-tests branch appeared</text><text x="62" y="780" class="note" text-anchor="start">The log line [spec-tests] says why.</text></g>
<g class="rise" style="animation-delay:4.29s"><circle cx="465" cy="754.5" r="4" fill="#B45309"/><text x="478" y="760" class="symptom" text-anchor="start">“names none of the pilot paths”</text><text x="478" y="780" class="note" text-anchor="start">The issue must name a path in paths.</text></g>
<g class="rise" style="animation-delay:4.54s"><circle cx="49" cy="806.5" r="4" fill="#B45309"/><text x="62" y="812" class="symptom" text-anchor="start">“is the coding agent”</text><text x="62" y="832" class="note" text-anchor="start">Give the test agent another name.</text></g>
<g class="rise" style="animation-delay:4.79s"><circle cx="465" cy="806.5" r="4" fill="#B45309"/><text x="478" y="812" class="symptom" text-anchor="start">A note says the budget ran out</text><text x="478" y="832" class="note" text-anchor="start">Raise maxCostPerIssue, or test by hand.</text></g>
</svg>
