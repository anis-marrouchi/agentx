<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 932" width="920" height="932" role="img" aria-labelledby="t d" style="--cycle:5.6s">
<title id="t">How a tracked plan runs</title>
<desc id="d">Eight steps in three parts, and one exception. You ask for work that takes several steps; the agent writes a plan with a name, an owner and a done check for each step; you approve the client message once, on a card. The agents work: the first step is built, the next step is handed to its agent, and the daemon checks the release is live. A step that goes quiet is nudged, then reported to you as blocked. The daemon sends the approved message to the client without asking again, and you get one summary at the end.</desc>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B0D12" flood-opacity="0.07"/></filter></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #0B0D12; }
.h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.sub { font-size: 16px; fill: #475569; }
.legend { font-size: 14px; font-weight: 600; }
.band { font-size: 12.5px; font-weight: 700; letter-spacing: 0.12em; fill: #1A66FF; }
.band.warn { fill: #B45309; }
.title { font-size: 17px; font-weight: 650; }
.note { font-size: 14px; fill: #475569; }
.rowname { font-size: 15px; font-weight: 600; }
.symptom { font-size: 15.5px; font-weight: 650; }
.state { font-size: 12.5px; font-weight: 600; }
.num { font-size: 14.5px; font-weight: 700; fill: #fff; }
.pill { font-size: 13px; font-weight: 700; fill: #fff; }
.wintitle { font-size: 13.5px; font-weight: 600; fill: #475569; }
.card { fill: #fff; stroke: #E2E8F0; stroke-width: 1.25; filter: url(#soft); }
.card.accent { stroke: #C7D9FF; }
.card.win { stroke: #0B0D12; stroke-width: 1.5; }
.link { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { fill: none; stroke: #1A66FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 100; animation: draw 0.9s ease-in-out backwards; }
.rise { animation: rise 0.55s cubic-bezier(.2,.7,.2,1) backwards; }
.fade { animation: fade 0.4s ease-out backwards; }
.pulse { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pulse var(--cycle) ease-out infinite; }
.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
@keyframes pulse { 0% { opacity: .7; transform: scale(1); } 9% { opacity: 0; transform: scale(1.9); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .rise, .fade, .wrap, .pulse, .blink { animation: none; } }
</style>
<rect width="920" height="932" rx="24" fill="#FFFFFF"/>
<text x="44" y="56" class="h1" text-anchor="start">How a tracked plan runs</text>
<text x="44" y="82" class="sub" text-anchor="start">You approve once. The daemon follows every step and tells you at the end.</text>
<circle cx="704" cy="50" r="7" fill="#1A66FF"/><text x="718" y="55" class="legend" text-anchor="start">You, the owner</text>
<circle cx="704" cy="74" r="7" fill="#0B0D12"/><text x="718" y="79" class="legend" text-anchor="start">The agents and the daemon</text>
<rect x="20" y="104" width="880" height="200" rx="20" fill="#F3F7FF"/>
<text x="44" y="132" class="band" text-anchor="start">YOU ASK, ONCE</text>
<g class="rise" style="animation-delay:0.32s">
<rect x="44" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="70" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:5.26s"/>
<circle cx="70" cy="176" r="15" fill="#1A66FF"/>
<text x="70" y="181" class="num" text-anchor="middle">1</text>
<text x="60" y="220" class="title" text-anchor="start">Ask for the work</text>
<text x="60" y="242" class="note" text-anchor="start">build it, ship it,</text>
<text x="60" y="259" class="note" text-anchor="start">tell the client</text>
</g>
<g class="rise" style="animation-delay:0.64s">
<rect x="328" y="148" width="264" height="136" rx="14" class="card"/>
<circle cx="354" cy="176" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:5.96s"/>
<circle cx="354" cy="176" r="15" fill="#0B0D12"/>
<text x="354" y="181" class="num" text-anchor="middle">2</text>
<text x="344" y="220" class="title" text-anchor="start">The agent writes</text>
<text x="344" y="241" class="title" text-anchor="start">the plan</text>
<text x="344" y="263" class="note" text-anchor="start">name, owner, done check</text>
</g>
<g class="fade" style="animation-delay:0.47s"><path d="M311 216 H323" class="link"/><path d="M319 212 L324 216 L319 220" class="link"/></g>
<g class="rise" style="animation-delay:0.96s">
<rect x="612" y="148" width="264" height="136" rx="14" class="card accent"/>
<circle cx="638" cy="176" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:6.66s"/>
<circle cx="638" cy="176" r="15" fill="#1A66FF"/>
<text x="638" y="181" class="num" text-anchor="middle">3</text>
<text x="628" y="220" class="title" text-anchor="start">Approve the client</text>
<text x="628" y="241" class="title" text-anchor="start">message</text>
<text x="628" y="263" class="note" text-anchor="start">one card, text editable</text>
</g>
<g class="fade" style="animation-delay:0.79s"><path d="M595 216 H607" class="link"/><path d="M603 212 L608 216 L603 220" class="link"/></g>
<rect x="20" y="320" width="880" height="200" rx="20" fill="#F6F7F9"/>
<text x="92" y="348" class="band" text-anchor="start">THE AGENTS WORK, THE DAEMON WATCHES</text>
<path d="M744 284 V302 Q744 312 734 312 H80 Q70 312 70 322 V360" class="wrap" pathLength="100" style="animation-delay:1.26s"/>
<path d="M65 355 L70 361 L75 355" class="link fade" style="animation-delay:2.16s"/>
<g class="rise" style="animation-delay:1.28s">
<rect x="44" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:7.36s"/>
<circle cx="70" cy="392" r="15" fill="#0B0D12"/>
<text x="70" y="397" class="num" text-anchor="middle">4</text>
<text x="60" y="436" class="title" text-anchor="start">Step 1 is built</text>
<text x="60" y="458" class="note" text-anchor="start">the agent reports it done,</text>
<text x="60" y="475" class="note" text-anchor="start">with the proof</text>
</g>
<g class="rise" style="animation-delay:1.60s">
<rect x="328" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="354" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:8.06s"/>
<circle cx="354" cy="392" r="15" fill="#0B0D12"/>
<text x="354" y="397" class="num" text-anchor="middle">5</text>
<text x="344" y="436" class="title" text-anchor="start">Step 2 is handed on</text>
<text x="344" y="458" class="note" text-anchor="start">the daemon starts a turn</text>
<text x="344" y="475" class="note" text-anchor="start">on its agent</text>
</g>
<g class="fade" style="animation-delay:1.43s"><path d="M311 432 H323" class="link"/><path d="M319 428 L324 432 L319 436" class="link"/></g>
<g class="rise" style="animation-delay:1.92s">
<rect x="612" y="364" width="264" height="136" rx="14" class="card"/>
<circle cx="638" cy="392" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:8.76s"/>
<circle cx="638" cy="392" r="15" fill="#0B0D12"/>
<text x="638" y="397" class="num" text-anchor="middle">6</text>
<text x="628" y="436" class="title" text-anchor="start">Live check passes</text>
<text x="628" y="458" class="note" text-anchor="start">the daemon reads the</text>
<text x="628" y="475" class="note" text-anchor="start">address it was given</text>
</g>
<g class="fade" style="animation-delay:1.75s"><path d="M595 432 H607" class="link"/><path d="M603 428 L608 432 L603 436" class="link"/></g>
<rect x="20" y="536" width="880" height="372" rx="20" fill="#F3F7FF"/>
<text x="92" y="564" class="band" text-anchor="start">THE PLAN FINISHES</text>
<path d="M744 500 V518 Q744 528 734 528 H80 Q70 528 70 538 V576" class="wrap" pathLength="100" style="animation-delay:2.22s"/>
<path d="M65 571 L70 577 L75 571" class="link fade" style="animation-delay:3.12s"/>
<g class="rise" style="animation-delay:2.24s">
<rect x="44" y="580" width="264" height="136" rx="14" class="card"/>
<circle cx="70" cy="608" r="15" fill="none" stroke="#0B0D12" stroke-width="2" class="pulse" style="animation-delay:9.46s"/>
<circle cx="70" cy="608" r="15" fill="#0B0D12"/>
<text x="70" y="613" class="num" text-anchor="middle">7</text>
<text x="60" y="652" class="title" text-anchor="start">Message sent</text>
<text x="60" y="673" class="title" text-anchor="start">to the client</text>
<text x="60" y="695" class="note" text-anchor="start">the approved text, once</text>
</g>
<g class="rise" style="animation-delay:2.56s">
<rect x="328" y="580" width="264" height="136" rx="14" class="card accent"/>
<circle cx="354" cy="608" r="15" fill="none" stroke="#1A66FF" stroke-width="2" class="pulse" style="animation-delay:10.16s"/>
<circle cx="354" cy="608" r="15" fill="#1A66FF"/>
<text x="354" y="613" class="num" text-anchor="middle">8</text>
<text x="344" y="652" class="title" text-anchor="start">One summary for you</text>
<text x="344" y="674" class="note" text-anchor="start">every step and its proof;</text>
<text x="344" y="691" class="note" text-anchor="start">the request closes</text>
</g>
<g class="fade" style="animation-delay:2.39s"><path d="M311 648 H323" class="link"/><path d="M319 644 L324 648 L319 652" class="link"/></g>
<g class="rise" style="animation-delay:2.96s"><rect x="612" y="614" width="264" height="68" rx="14" class="card"/><rect x="612" y="614" width="6" height="68" rx="3" fill="#DC2626"/><text x="634" y="643" class="title" text-anchor="start">A step goes quiet</text><text x="634" y="665" class="note" text-anchor="start">Nudged, then reported as blocked.</text></g>
<g class="rise" style="animation-delay:4.16s"><text x="44" y="772" class="band warn" text-anchor="start">IF IT DOES NOT WORK</text></g>
<g class="rise" style="animation-delay:4.36s"><circle cx="49" cy="798.5" r="4" fill="#B45309"/><text x="62" y="804" class="symptom" text-anchor="start">No plan is made</text><text x="62" y="824" class="note" text-anchor="start">Turn requests on; plans need them.</text></g>
<g class="rise" style="animation-delay:4.61s"><circle cx="465" cy="798.5" r="4" fill="#B45309"/><text x="478" y="804" class="symptom" text-anchor="start">A step is blocked</text><text x="478" y="824" class="note" text-anchor="start">Answer the agent, or retry the step.</text></g>
<g class="rise" style="animation-delay:4.86s"><circle cx="49" cy="850.5" r="4" fill="#B45309"/><text x="62" y="856" class="symptom" text-anchor="start">The message did not go</text><text x="62" y="876" class="note" text-anchor="start">The card is unanswered, or expired.</text></g>
<g class="rise" style="animation-delay:5.11s"><circle cx="465" cy="850.5" r="4" fill="#B45309"/><text x="478" y="856" class="symptom" text-anchor="start">Nudges come too soon</text><text x="478" y="876" class="note" text-anchor="start">Raise the stall time.</text></g>
</svg>
