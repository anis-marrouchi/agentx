# Situation learn: the weekly learned-templates run (#1892 phase 8, #1990).
#
# Installed at daemon start while `situations.learned.enabled` is on, and
# put back at each daemon start if this file was changed or deleted
# (situations/workflows.ts): it is not meant to be edited. Runs once a
# week (the cron below); the code also refuses a second week within 6.5
# days, whatever starts it. Its two steps run only in this workflow.
#
#   1. draft:   starts the week: last week's card closes and its
#               unanswered drafts are dropped; a template no talk used for
#               8 weeks is retired; after two unanswered cards in a row
#               learning pauses itself. Then, unless paused, one model
#               call over the ended talks of the last few weeks, redacted
#               (counts and shared lower-case purpose words; no messages,
#               names, numbers or chat ids). Up to `maxDrafts` drafts (2 by
#               default) in a fixed schema: prompt rules and closing-note
#               guidance only.
#   2. card:    one owner-only decision card with this week's drafts, each
#               answered yes or no by the owner (in the popup, or with
#               `agentx situation learned answer`). None when nothing is
#               new. No agent approves. Nothing is used before a yes.
#   3. tell_owner: one message, only when there is something to say and
#               no card to say it on (learning paused, a template retired,
#               or the records cannot be trusted).
#
# Cost (per node): the drafting call is booked at its estimate before it
# starts, against `improve.dailyUsd` and, over 6.5 days, against
# `situations.learned.maxRunUsd` ($2 at most). A call that would pass
# either is not made.
#
# Neither step takes inputs: editing this file can change when it runs,
# not what is drafted, what the card holds or what the owner answered.

id: situation-learn
version: 2
title: Situation learn
description: Once a week, drafts situation templates from ended talks and puts them on one card for the owner to answer. Nothing learned is used before the owner's yes.
autoStart: false

nodes:
  - id: start
    type: trigger.cron
    config:
      spec: "0 4 * * 1"
      timezone: UTC

  - id: draft
    type: action.builtin
    config:
      name: situation.learn.draft

  - id: card
    type: action.builtin
    config:
      name: situation.learn.card

  - id: decided
    type: branch
    config:
      cases:
        - when: { kind: exists, params: { path: card.notice } }
          to: tell_owner
      default: done

  - id: tell_owner
    type: owner.notify
    config:
      text: "{{card.notice}}"

  - id: done
    type: end
    config:
      status: completed

edges:
  - { from: start, to: draft }
  - { from: draft, to: card }
  - { from: card, to: decided }
  - { from: decided, fromPort: tell_owner, to: tell_owner }
  - { from: decided, fromPort: done, to: done }
  - { from: tell_owner, to: done }
