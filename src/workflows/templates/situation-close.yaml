# Situation close: the closing steps of a talk that ended (#1892, phase 4).
#
# Started by the situation record itself, once per end of a talk that has
# closing steps (`agentx situation closing <id> ...`), never by a chat
# message and never as a subProcess of another workflow: a workflow that
# runs a meeting ends the situation, and the record starts this run.
#
#   1. notes:     the talk's agent writes one note at the talk's home and
#                 lists the follow-ups that were agreed.
#   2. promises:  each follow-up becomes an open promise with an owner.
#   3. tell_owner: one message to the owner. It goes through the owner's
#                 hold, so it waits while the owner is in Focus or a call.
#   4. tell_other_side: only when the talk has a closing message for the
#                 other side. It is outward, so the owner is asked first
#                 (`approval: step`: always a card, never sent on its own).
#
# A talk that ended for lack of activity ("stale") runs the inward steps
# only (1 and 2): no owner message and nothing outward. A talk another
# organisation's agent said was over starts no close at all.
#
# Every message from this run carries the talk's end generation: if the
# talk was opened again since, the message is not sent (S7).

id: situation-close
version: 2
title: Situation close
description: Closing steps of a talk that ended. One note at its home, each follow-up an open promise with an owner, one message to the owner. Started by the situation record, once per end.
autoStart: false
approval: step

nodes:
  - id: start
    type: trigger.manual
    config:
      inputSchema:
        type: object
        properties:
          situationId:   { type: string, description: "The situation record's id" }
          endGeneration: { type: number, description: "Which end of the talk this close is for" }
          reason:        { type: string, description: "Why the talk ended: closed, courtesy loop, stale, person" }
          inwardOnly:    { type: string, description: "yes: notes and promises only (a stale end)" }
          agent:         { type: string, description: "The agent that writes the note and owns the follow-ups" }
          purpose:       { type: string, description: "What the talk was" }
          home:          { type: string, description: "Where the note goes" }
          channel:       { type: string }
          chatId:        { type: string }
          accountId:     { type: string }
          message:       { type: string, description: "A closing message to the other side (asked first)" }
        required: [situationId, endGeneration, agent, purpose, home, channel, chatId]

  - id: notes
    type: agent
    config:
      agentId: "{{start.agent}}"
      resultParser: json
      prompt: |
        The talk "{{start.purpose}}" ({{start.channel}} chat {{start.chatId}}) has ended (reason: {{start.reason}}).
        Write one note about it at its home: {{start.home}}
        Write the note once. Do not write to the chat and do not message the other side.
        Then list each follow-up that was agreed in the talk: what it is, who owes it (an agent id, or "owner"), who waits on it, and a due time only if a person gave one.
        End your reply with one JSON block, and nothing after it:
        {"noteAt": "<link to the note you wrote>", "followUps": [{"what": "...", "owner": "...", "waitsOn": "...", "due": ""}]}

  - id: promises
    type: action.builtin
    config:
      name: situation.promises
      input:
        situationId: "{{start.situationId}}"
        endGeneration: "{{start.endGeneration}}"
        agent: "{{start.agent}}"
        channel: "{{start.channel}}"
        chatId: "{{start.chatId}}"
        home: "{{start.home}}"
        followUps: "{{notes.json.followUps}}"

  - id: inward_only
    type: branch
    config:
      cases:
        - when: { kind: equals, params: { path: start.inwardOnly, value: "yes" } }
          to: done
      default: tell_owner

  - id: tell_owner
    type: owner.notify
    config:
      situation: { id: "{{start.situationId}}", endGeneration: "{{start.endGeneration}}" }
      text: "About {{start.purpose}}: the talk ended ({{start.reason}}). Note: {{notes.json.noteAt}}. {{promises.summary}}"

  - id: outward
    type: branch
    config:
      cases:
        - when: { kind: exists, params: { path: start.message } }
          to: tell_other_side
      default: done

  - id: tell_other_side
    type: person.message
    config:
      channel: "{{start.channel}}"
      chatId: "{{start.chatId}}"
      accountId: "{{start.accountId}}"
      situation: { id: "{{start.situationId}}", endGeneration: "{{start.endGeneration}}" }
      text: "{{start.message}}"

  - id: done
    type: end
    config:
      status: completed

edges:
  - { from: start, to: notes }
  - { from: notes, to: promises }
  - { from: promises, to: inward_only }
  - { from: inward_only, fromPort: done, to: done }
  - { from: inward_only, fromPort: tell_owner, to: tell_owner }
  - { from: tell_owner, to: outward }
  - { from: outward, fromPort: tell_other_side, to: tell_other_side }
  - { from: outward, fromPort: done, to: done }
  - { from: tell_other_side, to: done }
