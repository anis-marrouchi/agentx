name: agentx_phone
description: "The AgentX phone shell: the phone app, plus place reminders through the phone's own geofencing (#676)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  native_geofence: ^1.3.1
  permission_handler: ^13.0.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
