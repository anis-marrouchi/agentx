<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · AgentX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
  // Theme before first paint: ?theme=light (default) or ?theme=dark
  if (new URLSearchParams(location.search).get('theme') === 'dark') document.documentElement.classList.add('dark');
</script>
<!-- AgentX Hub Settings mock: section "inbox". Design rules: orca-design skill (Orca, MIT, (c) 2026 Lovecast Inc.). -->
<style>
:root{
  --background:#fff;--foreground:#0a0a0a;--card:#fff;--popover:#fff;
  --primary:#171717;--primary-foreground:#fafafa;--secondary:#f5f5f5;
  --muted:#f5f5f5;--muted-foreground:#696969;--accent:#f5f5f5;
  --border:#e5e5e5;--input:#e5e5e5;--ring:#a1a1a1;--destructive:#e40014;
  --side:#f5f5f5;--side-accent:#eaeaea;--side-border:#e5e5e5;
  --status-success:#147638;--status-warning:#ca8a04;
  --brand:#1447e6;--brand-foreground:#fff;
  --radius:10px;--shadow-xs:0 1px 2px 0 rgb(0 0 0/.05);--shadow-floating:0 10px 24px rgb(0 0 0/.18);
  --notice-shadow:0 16px 40px -8px rgb(0 0 0/.28),0 3px 8px rgb(0 0 0/.12);
  --font-sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'Geist Mono','SF Mono',SFMono-Regular,ui-monospace,Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(0.16,1,0.3,1);--ease-in:cubic-bezier(0.7,0,0.84,0);
  --kbd-hl:color-mix(in srgb,var(--foreground) 13%,var(--background));
  --kbd-ring:inset 0 0 0 1px color-mix(in srgb,var(--foreground) 19%,transparent);
  color-scheme:light;
}
.dark{
  --background:#0a0a0a;--foreground:#f0f0f0;--card:#171717;--popover:#171717;
  --primary:#e5e5e5;--primary-foreground:#171717;--secondary:#262626;
  --muted:#262626;--muted-foreground:#acacac;--accent:#404040;
  --border:rgb(255 255 255/.07);--input:rgb(255 255 255/.15);--ring:#737373;--destructive:#ff6568;
  --side:#2a2a2a;--side-accent:#353535;--side-border:rgb(255 255 255/.07);
  --status-success:#86efac;--status-warning:#eab308;
  --brand:#3b6cf6;--brand-foreground:#fff;
  --shadow-xs:0 1px 2px 0 rgb(0 0 0/.3);--shadow-floating:0 10px 24px rgb(0 0 0/.45);
  --kbd-hl:var(--accent);
  --kbd-ring:inset 0 0 0 1px color-mix(in srgb,var(--foreground) 16%,transparent);
  color-scheme:dark;
}
html.no-transitions *,html.no-transitions *::before,html.no-transitions *::after{transition:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font-sans);letter-spacing:.01em;-webkit-font-smoothing:antialiased;
  background:var(--background);color:var(--foreground);font-size:14px;line-height:1.4;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
.mono,code{font-family:var(--font-mono);font-size:12px;letter-spacing:0}
code{overflow-wrap:anywhere}
svg.lucide{width:16px;height:16px;stroke-width:2;flex-shrink:0}
.i14 svg.lucide, svg.lucide.i14{width:14px;height:14px}
.i12 svg.lucide, svg.lucide.i12{width:12px;height:12px}
:focus{outline:none}
:focus-visible{box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 50%,transparent)}
.muted{color:var(--muted-foreground)}

/* ---------- shell ---------- */
.app{display:flex;height:100vh}
.side{width:280px;flex-shrink:0;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--side-border)}
.side-top{height:48px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--side-border)}
.back{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--muted-foreground);transition:background-color .12s ease,color .12s ease}
.search{position:relative;padding:12px;border-bottom:1px solid var(--side-border)}
.search .s-ico{position:absolute;left:24px;top:50%;transform:translateY(-50%);color:var(--muted-foreground);pointer-events:none;display:flex}
.search input{width:100%;height:32px;border-radius:8px;border:1px solid var(--input);background:color-mix(in srgb,var(--background) 60%,transparent);padding:0 52px 0 36px;font-size:13px;transition:border-color .12s ease}
.search input::placeholder{color:var(--muted-foreground)}
.search input:focus-visible{border-color:var(--ring)}
.search .s-end{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;align-items:center}
.kbd{display:inline-flex;align-items:center;gap:1px;height:18px;padding:0 5px;border-radius:4px;border:1px solid var(--border);background:var(--background);font-size:10.5px;color:var(--muted-foreground);font-family:var(--font-sans);letter-spacing:.02em}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;color:var(--muted-foreground);transition:background-color .12s ease,color .12s ease,opacity .12s ease;flex-shrink:0}
.icon-btn.sm{width:22px;height:22px;border-radius:6px}
.nav{flex:1;overflow-y:auto;padding:16px 12px 24px}
.nav-group+.nav-group{margin-top:20px}
.nav-label{padding:0 12px;margin-bottom:6px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.18em;color:var(--muted-foreground)}
.nav-items{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:10px;font-size:13px;text-align:left;color:color-mix(in srgb,var(--foreground) 60%,transparent);transition:background-color .12s ease,color .12s ease}
.nav-item .n-chev{display:none;margin-left:auto;color:var(--muted-foreground)}
.nav-item[aria-current="page"]{background:var(--side-accent);color:var(--foreground);font-weight:500}
.results{display:flex;flex-direction:column;gap:2px}
.result{display:flex;flex-direction:column;gap:1px;width:100%;padding:7px 10px;border-radius:10px;text-align:left;transition:background-color .12s ease}
.result .r-label{font-size:13px;color:var(--foreground)}
.result .r-path{font-size:11px;color:var(--muted-foreground)}
.result mark{background:none;color:inherit;font-weight:600}
.result[data-hl="true"]{background:var(--kbd-hl);box-shadow:var(--kbd-ring)}
.no-results{padding:20px 12px;text-align:center;font-size:12.5px;color:var(--muted-foreground)}
.no-results button{margin-top:10px}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.crumbs{height:48px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--border);font-size:14px}
.crumbs .c-muted{color:var(--muted-foreground)}
.crumbs .sep{color:var(--muted-foreground);opacity:.6}
.crumbs .spacer{flex:1}
.crumbs .m-back,.crumbs .m-title,.crumbs .m-search{display:none}
.scroll{flex:1;overflow-y:auto;scrollbar-gutter:stable}
.col{margin:0 auto;width:100%;max-width:784px;padding:24px 32px 96px}
.pane{display:flex;flex-direction:column;gap:24px}
.pane.enter{animation:paneIn .18s var(--ease-out)}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pane-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:20px;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.dark .pane-head{border-bottom-color:var(--border)}
.pane-head h2{margin:0;font-size:24px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.pane-head p{margin:6px 0 0;font-size:14px;line-height:24px;color:var(--muted-foreground);max-width:48rem}
.pane-head .ph-act{display:flex;gap:8px;align-items:center;flex-shrink:0}
.pane-body{display:flex;flex-direction:column;gap:32px}

.group{display:flex;flex-direction:column;gap:12px}
.group-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 4px}
.group-head h3{margin:0;font-size:15px;font-weight:600;line-height:1.4}
.group-head p{margin:2px 0 0;font-size:12.5px;line-height:1.35;color:var(--muted-foreground)}
.group-head .g-act{display:flex;gap:8px;flex-shrink:0}
.card{border:1px solid var(--border);border-radius:14px;background:color-mix(in srgb,var(--card) 50%,transparent);box-shadow:var(--shadow-xs);padding:0 20px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;padding:9px 0;position:relative}
.card>*+*{border-top:1px solid var(--border)}
.row .l{min-width:0;display:flex;flex-direction:column;gap:1px;flex:1}
.row .label{font-size:14px;line-height:1.4;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .help{font-size:12.5px;line-height:1.35;color:var(--muted-foreground);overflow-wrap:anywhere}
.row .r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.row.flash::before,.item.flash::before{content:"";position:absolute;inset:0 -20px;background:color-mix(in srgb,var(--foreground) 7%,transparent);pointer-events:none;opacity:0}
@media (prefers-reduced-motion:no-preference){.row.flash::before,.item.flash::before{animation:flash 3s ease-out}}
@media (prefers-reduced-motion:reduce){.row.flash::before,.item.flash::before{opacity:1}}
@keyframes flash{0%,20%{opacity:1}100%{opacity:0}}
.row.changed .label::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}
.row .was{font-size:12px;color:var(--brand)}

/* list items (agents, actions, projects...) */
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;position:relative}
.item .avatar{width:28px;height:28px;border-radius:8px;background:var(--muted);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted-foreground);flex-shrink:0;font-size:11px;font-weight:600;letter-spacing:.02em}
.item .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .name{font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .meta{font-size:12.5px;color:var(--muted-foreground);display:flex;align-items:center;gap:4px 6px;flex-wrap:wrap;overflow-wrap:anywhere}
.item .meta .mono{font-size:11.5px}
.item .meta .dotsep{opacity:.6}
.item .ctrls{display:flex;align-items:center;gap:6px;flex-shrink:0;min-height:28px}
.item.off .who,.item.off .avatar{opacity:.7}
.item .more[aria-expanded="true"]{opacity:1!important;background:var(--accent);color:var(--foreground)}
.item .sub-panel{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.cmd{font-family:var(--font-mono);font-size:11.5px;letter-spacing:0;color:var(--muted-foreground);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;background:var(--muted);font-family:var(--font-mono);font-size:10.5px;letter-spacing:0;color:var(--muted-foreground);white-space:nowrap}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--status-success);display:inline-block;flex-shrink:0}
.status-dot.idle{background:var(--muted-foreground);opacity:.5}
.status-dot.warn{background:var(--status-warning)}
.status-dot.err{background:var(--destructive)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap;transition:background-color .12s ease,color .12s ease,opacity .12s ease,transform .12s ease}
.btn:active{transform:scale(.97)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.outline{border:1px solid var(--border);background:var(--background);box-shadow:var(--shadow-xs)}
.dark .btn.outline{background:color-mix(in srgb,var(--input) 30%,transparent);border-color:var(--input)}
.btn.ghost{color:var(--muted-foreground)}
.btn.primary{background:var(--brand);color:var(--brand-foreground)}
.btn.danger{color:var(--destructive);border:1px solid color-mix(in srgb,var(--destructive) 30%,var(--border));background:transparent}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{color:var(--foreground);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--foreground) 30%,transparent);text-underline-offset:3px}

.select{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 8px 0 9px;border-radius:8px;border:1px solid var(--input);background:var(--background);box-shadow:var(--shadow-xs);font-size:12.5px;text-align:left;white-space:nowrap;transition:background-color .12s ease,border-color .12s ease;max-width:100%}
.dark .select{background:color-mix(in srgb,var(--input) 30%,transparent)}
.select .v{flex:1;min-width:0;white-space:nowrap}
.select .chev{color:var(--muted-foreground);display:flex}
.select[aria-expanded="true"]{border-color:var(--ring)}
.select.mono .v{font-family:var(--font-mono);font-size:11.5px;letter-spacing:0}
.select .s-ico{display:flex;color:var(--muted-foreground)}
svg.eng{width:14px;height:14px;flex-shrink:0;display:block}

.input{height:28px;border-radius:8px;border:1px solid var(--input);background:var(--background);padding:0 9px;font-size:12.5px;box-shadow:var(--shadow-xs);transition:border-color .12s ease;min-width:0}
.dark .input{background:color-mix(in srgb,var(--input) 30%,transparent)}
.input:focus-visible{border-color:var(--ring)}
.input.mono{font-family:var(--font-mono);font-size:11.5px}
.input::placeholder,textarea::placeholder{color:var(--muted-foreground)}
.input.changed,.textarea.changed{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 15%,transparent)}
.num{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted-foreground)}
.num .input{width:64px;text-align:right;font-variant-numeric:tabular-nums;color:var(--foreground)}
.textarea{width:100%;border-radius:8px;border:1px solid var(--input);background:var(--background);padding:8px 10px;font-size:13px;line-height:1.5;resize:vertical;box-shadow:var(--shadow-xs)}
.dark .textarea{background:color-mix(in srgb,var(--input) 30%,transparent)}
.textarea.mono{font-family:var(--font-mono);font-size:12px}
.row.stack{flex-direction:column;align-items:stretch;gap:8px}
.row.stack .r{width:100%}

.switch{position:relative;width:32px;height:18px;border-radius:999px;background:var(--input);transition:background-color .15s ease;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--background);box-shadow:0 1px 2px rgb(0 0 0/.2);transition:transform .15s var(--ease-out)}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}
.dark .switch{background:color-mix(in srgb,var(--foreground) 12%,transparent)}
.dark .switch::after{background:color-mix(in srgb,var(--foreground) 55%,var(--background));box-shadow:none}
.dark .switch[aria-checked="true"]{background:color-mix(in srgb,var(--foreground) 38%,var(--background))}
.dark .switch[aria-checked="true"]::after{background:var(--foreground)}

.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--muted);gap:2px;flex-wrap:wrap}
.seg button{height:26px;padding:0 10px;border-radius:7px;font-size:12.5px;color:var(--muted-foreground);white-space:nowrap;transition:background-color .12s ease,color .12s ease}
.seg button[aria-pressed="true"]{background:var(--background);color:var(--foreground);font-weight:500;box-shadow:var(--shadow-xs)}
.dark .seg button[aria-pressed="true"]{background:var(--accent)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tabs button{position:relative;height:36px;padding:0 10px;font-size:13px;color:var(--muted-foreground);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--foreground);font-weight:500}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--foreground)}

.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;border:1px solid var(--border);color:var(--muted-foreground);white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.sm{height:18px;padding:0 6px;font-size:10.5px}
.badge.ok{color:var(--status-success);background:color-mix(in srgb,var(--status-success) 10%,var(--background));border-color:color-mix(in srgb,var(--status-success) 25%,var(--background))}
.badge.warn{color:color-mix(in srgb,var(--status-warning) 70%,var(--foreground));background:color-mix(in srgb,var(--status-warning) 10%,var(--background));border-color:color-mix(in srgb,var(--status-warning) 25%,var(--background))}
.badge.err{color:var(--destructive);background:color-mix(in srgb,var(--destructive) 8%,var(--background));border-color:color-mix(in srgb,var(--destructive) 25%,var(--background))}
.badge.off .dot{background:var(--muted-foreground);opacity:.6}
.badge.changed{color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,var(--background));border-color:color-mix(in srgb,var(--brand) 25%,var(--background))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 4px 0 8px;border-radius:6px;border:1px solid var(--border);font-size:12px;background:var(--background)}
.chip.mono{font-family:var(--font-mono);font-size:11.5px;letter-spacing:0}
.chip button{display:flex;color:var(--muted-foreground);border-radius:4px;padding:1px}
.chip.add{padding:0 8px;color:var(--muted-foreground);border-style:dashed}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 0;text-align:center;font-size:13px;color:var(--muted-foreground)}
.note{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--muted-foreground);padding:2px 4px}
.note svg{margin-top:1px}
.inline-err{font-size:12px;color:var(--destructive)}

.disclosure>button{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;font-size:14px;font-weight:600;text-align:left}
.disclosure>button .chev{color:var(--muted-foreground);display:flex;transition:transform .2s var(--ease-out)}
.disclosure>button .d-count{font-weight:400;font-size:12.5px;color:var(--muted-foreground)}
.disclosure[data-open="true"]>button .chev{transform:rotate(90deg)}
.disclosure .d-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .18s var(--ease-out)}
.disclosure[data-open="true"] .d-body{grid-template-rows:1fr}
.disclosure .d-inner{overflow:hidden;padding-left:20px}
.disclosure .d-inner>*{border-top:1px solid var(--border)}
.disclosure[data-open="true"] .d-inner{padding-bottom:4px}

/* tables that become stacked rows on a phone */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);padding:10px 8px 8px 0;white-space:nowrap}
.tbl td{padding:9px 8px 9px 0;border-top:1px solid var(--border);vertical-align:top;font-variant-numeric:tabular-nums}
.tbl td.num,.tbl th.num{text-align:right}
.tbl td.mono{font-size:11.5px}
.logs{margin:0;padding:12px 0;font-family:var(--font-mono);font-size:11.5px;line-height:1.6;letter-spacing:0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow-y:auto}
.logs .err{color:var(--destructive)}
.logs .warn{color:color-mix(in srgb,var(--status-warning) 70%,var(--foreground))}
.logs .dim{color:var(--muted-foreground)}
.bars{display:flex;align-items:flex-end;gap:3px;height:96px;padding:16px 0 4px}
.bars .bar{flex:1;background:color-mix(in srgb,var(--foreground) 22%,transparent);border-radius:3px 3px 0 0;position:relative;overflow:hidden;min-height:2px}
.bars .bar i{position:absolute;left:0;right:0;bottom:0;background:var(--destructive)}
.bars-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted-foreground);padding-bottom:10px}

/* save bar */
.savebar{position:sticky;bottom:16px;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px 10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--popover);box-shadow:var(--shadow-floating);font-size:13px}
.dark .savebar{border-color:rgb(255 255 255/.1)}
.savebar .sb-t{flex:1 1 220px;min-width:0}
.savebar .sb-t small{display:block;font-size:12px;color:var(--muted-foreground)}
.savebar .sb-acts{display:flex;gap:8px;margin-left:auto}

/* ---------- floating ---------- */
.pop{position:fixed;z-index:50;min-width:176px;background:var(--popover);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-floating);padding:4px;opacity:0;transform:scale(.98);transition:opacity .15s var(--ease-out),transform .15s var(--ease-out);pointer-events:none}
.dark .pop{border-color:rgb(255 255 255/.1)}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop.closing{transition:opacity .1s var(--ease-in),transform .1s var(--ease-in)}
.pop .p-list{max-height:300px;overflow-y:auto}
.pop .p-group{padding:6px 8px 4px;font-size:11px;font-weight:500;color:var(--muted-foreground);display:flex;align-items:center;gap:6px}
.pop .p-item{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:5px 8px;border-radius:6px;font-size:13px;text-align:left}
.pop .p-item .p-sub{margin-left:auto;padding-left:12px;font-size:11px;color:var(--muted-foreground);white-space:nowrap}
.pop .p-item .check{width:14px;display:flex;color:var(--foreground)}
.pop .p-item .ico{color:var(--muted-foreground);display:flex}
.pop .p-item[data-hl="true"]{background:var(--kbd-hl);box-shadow:var(--kbd-ring)}
.pop .p-item.destructive,.pop .p-item.destructive .ico{color:var(--destructive)}
.pop .p-sep{height:1px;background:var(--border);margin:4px -4px}

.tip{position:fixed;z-index:60;padding:4px 8px;border-radius:6px;background:var(--foreground);color:var(--background);font-size:12px;display:flex;align-items:center;gap:6px;pointer-events:none;opacity:0;transform:scale(.97);transform-origin:bottom center;transition:opacity .125s var(--ease-out),transform .125s var(--ease-out)}
.tip.show{opacity:1;transform:none}
.tip.instant{transition:none}
.tip .kbd{background:transparent;border-color:color-mix(in srgb,var(--background) 30%,transparent);color:color-mix(in srgb,var(--background) 75%,transparent);height:16px}

.overlay{position:fixed;inset:0;z-index:40;background:rgb(0 0 0/.4);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;opacity:0;pointer-events:none;transition:opacity .15s ease;overflow-y:auto}
.overlay.open{opacity:1;pointer-events:auto}
.dialog{width:480px;max-width:100%;background:var(--popover);border:1px solid rgb(0 0 0/.14);border-radius:12px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.28);transform:scale(.96);opacity:0;transition:transform .2s var(--ease-out),opacity .2s var(--ease-out)}
.dark .dialog{border-color:rgb(255 255 255/.1)}
.overlay.open .dialog{transform:none;opacity:1}
.dialog h4{margin:0;font-size:16px;font-weight:600}
.dialog .d-sub{margin:4px 0 20px;font-size:13px;color:var(--muted-foreground)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label{font-size:13px;font-weight:500}
.field .f-help{font-size:12px;color:var(--muted-foreground)}
.field .input{height:32px;font-size:13px;width:100%}
.field .input.mono{font-size:12px}
.field .select{height:32px;width:100%}
.field .select .v{text-align:left}
.field-row{display:flex;gap:12px;flex-wrap:wrap}
.field-row .field{flex:1 1 180px}
.dialog .disclosure{border-top:1px solid var(--border);margin-bottom:8px}
.dialog .disclosure .d-inner{padding-left:0}
.dialog .disclosure .d-inner>*{border-top:0}
.dialog .disclosure[data-open="true"] .d-inner{padding-top:8px}
.d-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;align-items:center}
.d-actions .d-left{margin-right:auto;font-size:12px;color:var(--muted-foreground)}

.toasts{position:fixed;right:24px;bottom:24px;z-index:70;width:356px;max-width:calc(100vw - 32px);display:flex;flex-direction:column-reverse;gap:14px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--popover);border:1px solid var(--border);box-shadow:var(--notice-shadow);font-size:13px;opacity:0;transform:translateY(12px);transition:opacity .4s ease,transform .4s ease}
.dark .toast{border-color:rgb(255 255 255/.1)}
.toast.in{opacity:1;transform:none}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .2s var(--ease-in),transform .2s var(--ease-in)}
.toast .t-ico{color:var(--muted-foreground);display:flex}
.toast .t-msg{flex:1;min-width:0}

@media (hover:hover){
  .back:hover{background:color-mix(in srgb,var(--foreground) 8%,transparent);color:var(--foreground)}
  .icon-btn:hover{background:var(--accent);color:var(--foreground)}
  .nav-item:not([aria-current="page"]):hover{background:color-mix(in srgb,var(--foreground) 8%,transparent);color:var(--foreground)}
  .result:hover{background:color-mix(in srgb,var(--foreground) 8%,transparent)}
  .btn.outline:hover{background:var(--accent)}
  .btn.ghost:hover{background:var(--accent);color:var(--foreground)}
  .btn.primary:hover{background:color-mix(in srgb,var(--brand) 88%,var(--foreground))}
  .btn.danger:hover{background:color-mix(in srgb,var(--destructive) 8%,transparent)}
  .select:hover{background:var(--accent)}
  .seg button:not([aria-pressed="true"]):hover,.tabs button:hover{color:var(--foreground)}
  .pop .p-item:hover{background:var(--accent)}
  .dark .pop .p-item:hover{background:color-mix(in srgb,var(--foreground) 8%,transparent)}
  .link:hover{text-decoration-color:currentColor}
  .item .more,.item .hov{opacity:0}
  .item:hover .more,.item:focus-within .more,.item:hover .hov,.item:focus-within .hov{opacity:1}
}
@media (prefers-reduced-motion:reduce){
  .pane.enter{animation:fadeOnly .15s ease}
  @keyframes fadeOnly{from{opacity:0}to{opacity:1}}
  .pop,.tip,.dialog,.toast,.toast.out{transform:none!important}
  .switch::after,.disclosure>button .chev,.btn:active{transition:none;transform:none}
}

/* ---------- phone: back-stack (list screen, then one section) ---------- */
@media (max-width:640px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  .side{display:none}
  .crumbs{position:sticky;top:0;z-index:10;background:var(--background);padding:0 8px;gap:4px}
  .crumbs .c-muted,.crumbs .sep,.crumbs #crumbCurrent{display:none}
  .crumbs .m-back{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 8px 0 4px;border-radius:8px;font-size:14px;color:var(--muted-foreground)}
  .crumbs .m-title{display:block;position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:14px;white-space:nowrap}
  .crumbs .m-search{display:inline-flex}
  .scroll{overflow:visible}
  .col{padding:16px 16px 64px}
  .pane-head{flex-direction:column;gap:12px;padding-bottom:16px}
  .pane-head h2{font-size:22px}
  .pane-head p{font-size:13.5px;line-height:22px}
  .pane-body{gap:28px}
  .group-head{flex-wrap:wrap;align-items:flex-start}
  .card{padding:0 14px}
  .row{flex-wrap:wrap;gap:8px 12px}
  .row .l{flex:1 1 180px}
  .row .r{margin-left:auto;flex-wrap:wrap;justify-content:flex-end;max-width:100%}
  .item{flex-wrap:wrap}
  .item .who{flex:1 1 200px}
  .item .ctrls{margin-left:auto}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{padding:10px 0;border-top:1px solid var(--border)}
  .tbl tr:first-child{border-top:0}
  .tbl td{border:0;padding:1px 0;text-align:left!important}
  .tbl td[data-k]::before{content:attr(data-k) " ";color:var(--muted-foreground);font-size:12px;font-family:var(--font-sans)}
  .tbl td:first-child{font-weight:500}
  .savebar{bottom:12px}
  .toasts{right:16px;bottom:16px}
  .overlay{padding-top:16px}
  .dialog{padding:20px}
  /* the list screen */
  body.menu-open .main{display:none}
  body.menu-open .side{display:flex;width:100%;border-right:0;min-height:100vh}
  body.menu-open .nav-item{padding:12px 10px;font-size:14px}
  body.menu-open .nav-item .n-chev{display:flex}
}

      ${it.sub ? `<span class="p-sub">${esc(it.sub)}</span>` : ''}
    </button>`;
  }).join('') + '</div>';
  paintIcons();
}
pop.tabIndex = -1;
pop.addEventListener('click', e => {
  const b = e.target.closest('.p-item'); if (!b || !popState) return;
  const it = popState.pickable[+b.dataset.k]; const fn = popState.onPick;
  closePop(); fn(it);
});

/* ---------------- tooltips ---------------- */
const tip = $('#tip'); let tipTimer, tipHideAt = 0, tipEl = null;
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]');
  if (t === tipEl) return;
  hideTip();
  if (!t || (popState && popState.trigger === t)) return;
  tipEl = t;
  const warm = Date.now() - tipHideAt < 300;
  tipTimer = setTimeout(() => showTip(t, warm), warm ? 0 : 600);
});
function showTip(t, instant) {
  tip.innerHTML = esc(t.dataset.tip) + (t.dataset.kbd ? ` <span class="kbd">${t.dataset.kbd}</span>` : '');
  const r = t.getBoundingClientRect();
  tip.classList.toggle('instant', instant);
  tip.style.left = '0px'; tip.style.top = '0px';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2)) + 'px';
  tip.style.top = (r.top - h - 4) + 'px';
  tip.classList.add('show');
}
function hideTip() { clearTimeout(tipTimer); if (tip.classList.contains('show')) tipHideAt = Date.now(); tip.classList.remove('show'); tipEl = null; }
document.addEventListener('mousedown', hideTip);

/* ---------------- toasts ---------------- */
function toast(html, action) {
  const box = $('#toasts');
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span class="t-ico">${icon('check','i14')}</span><span class="t-msg">${html}</span>` + (action ? `<button class="btn outline sm">${action.label}</button>` : '');
  box.appendChild(t); paintIcons();
  while (box.children.length > 3) box.firstChild.remove();
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('in')));
  let timer;
  const kill = () => { t.classList.add('out'); setTimeout(() => t.remove(), 220); };
  const arm = () => { timer = setTimeout(kill, 4000); };
  t.addEventListener('mouseenter', () => clearTimeout(timer));
  t.addEventListener('mouseleave', arm);
  if (action) t.querySelector('button').onclick = () => { action.run(); clearTimeout(timer); kill(); };
  arm();
}

/* ---------------- dialog (generic form) ---------------- */
// spec: {title, sub, fields:[field], advanced:[field], submit, foot, onSubmit(values) -> error string | undefined}
// field: {id, label, help, kind:'text'|'mono'|'select'|'area'|'switch'|'seg', value, ph, opts, row:[field,field]}
const overlay = $('#overlay'); let dlgSpec = null;
function fieldHtml(f) {
  if (f.row) return `<div class="field-row">${f.row.map(fieldHtml).join('')}</div>`;
  let ctl;
  if (f.kind === 'select') ctl = sel('dlg-' + f.id, f.value, f.opts, { mono: f.mono, label: f.label });
  else if (f.kind === 'seg') ctl = `<div class="seg" data-segf="${f.id}">${f.opts.map(o => `<button type="button" aria-pressed="${o === f.value}" data-segv="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  else if (f.kind === 'area') ctl = `<textarea class="textarea ${f.mono ? 'mono' : ''}" id="dlg-${f.id}" rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(f.value || '')}</textarea>`;
  else if (f.kind === 'switch') return `<div class="field" style="flex-direction:row;align-items:center;justify-content:space-between;gap:12px"><div style="display:flex;flex-direction:column;gap:2px"><label>${f.label}</label>${f.help ? `<span class="f-help">${f.help}</span>` : ''}</div>${sw('dlg-' + f.id, f.value, f.label)}</div>`;
  else ctl = `<input class="input ${f.kind === 'mono' ? 'mono' : ''}" id="dlg-${f.id}" value="${esc(f.value || '')}" placeholder="${esc(f.ph || '')}" autocomplete="off" spellcheck="false">`;
  return `<div class="field" data-field="${f.id}"><label for="dlg-${f.id}">${f.label}</label>${ctl}${f.help ? `<span class="f-help">${f.help}</span>` : ''}<span class="inline-err" data-err="${f.id}"></span></div>`;
}
function openDialog(spec) {
  dlgSpec = spec; OPEN['dlg-adv'] = false;
  const fields = typeof spec.fields === 'function' ? spec.fields() : spec.fields;
  $('#dialog').innerHTML = `<h4>${spec.title}</h4>${spec.sub ? `<p class="d-sub">${spec.sub}</p>` : '<div style="height:16px"></div>'}
    <div id="dlgFields">${fields.map(fieldHtml).join('')}</div>
    ${spec.advanced && spec.advanced.length ? disclosure('dlg-adv', 'Advanced', spec.advanced.map(fieldHtml).join('')) : ''}
    <div class="d-actions">${spec.foot ? `<span class="d-left">${spec.foot}</span>` : ''}<button type="button" class="btn ghost" id="dCancel">Cancel</button><button type="submit" class="btn primary">${spec.submit}</button></div>`;
  paintIcons();
  overlay.classList.add('open');
  setTimeout(() => { const f = $('#dialog input, #dialog textarea'); f && f.focus(); }, 0);
}
function closeDialog() { overlay.classList.remove('open'); dlgSpec = null; }
overlay.addEventListener('mousedown', e => { if (e.target === overlay) closeDialog(); });
$('#dialog').addEventListener('submit', e => {
  e.preventDefault();
  const v = {};
  $$('#dialog [id^="dlg-"]').forEach(el => { v[el.id.slice(4)] = el.matches('.select') ? el.dataset.val : el.matches('.switch') ? el.getAttribute('aria-checked') === 'true' : el.value; });
  $$('#dialog [data-segf]').forEach(el => { v[el.dataset.segf] = $('[aria-pressed="true"]', el).dataset.segv; });
  $$('#dialog [data-err]').forEach(el => { el.textContent = ''; });
  $$('#dialog .input').forEach(el => el.removeAttribute('aria-invalid'));
  const err = dlgSpec.onSubmit ? dlgSpec.onSubmit(v) : null;
  if (err) { const [fid, msg] = err; const el = $(`[data-err="${fid}"]`); if (el) el.textContent = msg; const inp = $('#dlg-' + fid); if (inp) { inp.setAttribute('aria-invalid', 'true'); inp.focus(); } return; }
  closeDialog();
});
// confirm dialog for destructive actions
function confirmDlg(title, sub, yes, run) {
  openDialog({ title, sub, fields: [], submit: yes, onSubmit: () => { run(); } });
  const b = $('#dialog .btn.primary'); b.classList.remove('primary'); b.classList.add('danger');
}

/* ---------------- generic clicks ---------------- */
const STATE = {};
document.addEventListener('click', e => {
  const t = e.target;
  if (popState && !pop.contains(t) && !t.closest('[aria-expanded="true"]')) closePop();
  const res = t.closest('[data-res]'); if (res) return openResult(+res.dataset.res);
  if (t.closest('#clearX') || t.closest('#clearSearch')) { $('#search').value = ''; query = ''; runSearch(); $('#search').focus(); return; }
  if (t.closest('#mBack')) { document.body.classList.add('menu-open'); scrollTo(0, 0); return; }
  if (t.closest('#mSearch')) { document.body.classList.add('menu-open'); $('#search').focus(); return; }
  if (t.closest('#backBtn') || t.closest('#closeBtn')) { toast('Back to the app'); return; }
  if (t.closest('#dCancel')) return closeDialog();
  if (SECTION.click && SECTION.click(t, e)) return;

  const swb = t.closest('[data-sw]');
  if (swb) { const on = swb.getAttribute('aria-checked') !== 'true'; swb.setAttribute('aria-checked', on); if (!swb.id.startsWith('dlg-') && !swb.closest('#dialog')) { STATE['sw:' + swb.dataset.sw] = on; if (SECTION.onSwitch) SECTION.onSwitch(swb.dataset.sw, on); else toast('Saved'); } return; }
  const seg = t.closest('[data-segv]');
  if (seg) { $$('button', seg.parentElement).forEach(b => b.setAttribute('aria-pressed', b === seg)); if (SECTION.onSeg) SECTION.onSeg(seg.parentElement.dataset.segf || seg.parentElement.dataset.seg, seg.dataset.segv); return; }
  const sb = t.closest('[data-sel]');
  if (sb) {
    const opts = JSON.parse(sb.dataset.opts);
    return openPop(sb, { checks: true, width: Math.max(180, sb.offsetWidth), align: sb.closest('.r') ? 'end' : 'start', items: opts.map(o => ({ ...o, checked: o.v === sb.dataset.val })), onPick: it => {
      sb.dataset.val = it.v; $('.v', sb).textContent = it.label;
      const ic = $('.s-ico', sb); if (ic && it.icon) { ic.innerHTML = icon(it.icon); paintIcons(); }
      STATE['sel:' + sb.dataset.sel] = it.v;
      if (sb.dataset.sel.startsWith('dlg-')) { if (dlgSpec && dlgSpec.onSel) dlgSpec.onSel(sb.dataset.sel.slice(4), it.v); return; }
      if (SECTION.onSel) SECTION.onSel(sb.dataset.sel, it.v); else toast('Saved');
    } });
  }
  const dt = t.closest('[data-disc]');
  if (dt) {
    const id = dt.dataset.disc; OPEN[id] = !OPEN[id];
    const d = dt.closest('.disclosure'); d.dataset.open = OPEN[id]; dt.setAttribute('aria-expanded', OPEN[id]);
    $('.d-inner', d).toggleAttribute('inert', !OPEN[id]);
    return;
  }
  const mb = t.closest('[data-more]');
  if (mb && SECTION.menu) { const items = SECTION.menu(mb.dataset.more); return openPop(mb, { width: 200, align: 'end', items, onPick: it => it.run && it.run() }); }
});
document.addEventListener('change', e => { if (e.target.matches('.col .input, .col .textarea') && SECTION.onInput) SECTION.onInput(e.target.id, e.target.value, 'change'); });
document.addEventListener('input', e => { if (e.target.matches('.col .input, .col .textarea') && SECTION.onInput) SECTION.onInput(e.target.id, e.target.value, 'input'); });

/* ---------------- search + keyboard ---------------- */
const search = $('#search');
search.addEventListener('input', () => { query = search.value; runSearch(); });
search.addEventListener('keydown', e => {
  if (!query) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); hl = Math.min(hl + 1, results.length - 1); renderNav(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); hl = Math.max(hl - 1, 0); renderNav(); }
  if (e.key === 'Enter') { e.preventDefault(); openResult(hl); }
});
document.addEventListener('keydown', e => {
  const mod = isMac ? e.metaKey : e.ctrlKey;
  if (popState) {
    const n = popState.pickable.length;
    if (e.key === 'Escape') { e.preventDefault(); popState.trigger.focus(); closePop(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); popState.kbd = true; popState.hl = (popState.hl + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; drawPop(); return; }
    if (e.key === 'Enter') { e.preventDefault(); const it = popState.pickable[popState.hl]; const fn = popState.onPick; if (it) { closePop(); fn(it); } return; }
    if (e.key === 'Tab') closePop(true);
  }
  if (overlay.classList.contains('open')) { if (e.key === 'Escape') { e.preventDefault(); closeDialog(); } return; }
  if (mod && e.key.toLowerCase() === 'f') { e.preventDefault(); if (matchMedia('(max-width:640px)').matches) document.body.classList.add('menu-open'); search.focus(); search.select(); return; }
  if (e.key === 'Escape') {
    if (document.activeElement === search && query) { search.value = ''; query = ''; runSearch(); return; }
    if (document.activeElement === search) { search.blur(); return; }
    if (document.body.classList.contains('menu-open')) { document.body.classList.remove('menu-open'); return; }
    if (SECTION.escape && SECTION.escape()) return;
    toast('Back to the app');
  }
});
addEventListener('resize', () => closePop(true));
$('#scroll').addEventListener('scroll', () => { closePop(true); hideTip(); }, { passive: true });

/* ---------------- boot ---------------- */
document.title = SECTION_NAME[SECTION.id] + ' · Settings · AgentX';
$('#crumbCurrent').textContent = SECTION_NAME[SECTION.id];
$('#mTitle').textContent = SECTION_NAME[SECTION.id];
renderNav();
const startRow = (location.hash.match(/row=([\w-]+)/) || [])[1];
renderPane(!startRow);
if (startRow) setTimeout(() => jumpTo(startRow), 50);

</script>
</body>
