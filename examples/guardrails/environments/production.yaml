# Production protected resources — Acme fleet.
#
# The catalog rules reference `target_in: production`, so DECLARING a host here
# is what ARMS them. `resolve_env: true` expands $VAR/${VAR}, reads .env* in the
# workspace, AND folds in ambient connection vars (DATABASE_URL, PGHOST, ...),
# so both of these are caught:
#   prisma migrate diff --shadow-database-url $DATABASE_URL   (explicit ref)
#   prisma migrate reset --force                              (ambient DATABASE_URL)
#
# Matching is host-based on purpose: hostnames are stable and non-secret, while
# credentials rotate and must never be committed here.
#
# Inventory sources: globex-odoo / initech-v1-coder / initech-servers-access skills,
# agentx mesh config, and a fleet-wide scan of agent workspace env files
# (2026-07-22). Re-run `agentx guard policy --agent <id>` after editing.

protected_resources:
  production:
    resolve_env: true

    hosts:
      # --- Globex ---------------------------------------------------------
      - "203.0.113.13"                 # Globex Odoo production (odoo + postgres + apache)

      # --- Initech ----------------------------------------------------------
      - "203.0.113.11"              # Initech V1 WordPress production host
      - "initech.example.com"                       # Initech V1 production site

      # --- DemoSite (the 2026-07-21 incident) ------------------------
      - "api.demosite.example.com"
      - "203.0.113.12"

      # --- Acme marketing site (Supabase prod) -------------------------
      - "db.rgznpcdznpcjoxxytwsh.supabase.co"
      - "rgznpcdznpcjoxxytwsh.supabase.co"
      - "aws-0-eu-central-1.pooler.supabase.com"

      # --- Shared platform ----------------------------------------------
      - "gitlab.example.com"              # source of truth for every project
      - "whatsapp.example.com"            # WhatsApp API endpoint
      - "example.com"                     # main site + V2 jump host

      # --- The agent fleet itself ---------------------------------------
      # peer-server runs all 22 production agents; destructive DB work
      # against it takes down the fleet (and its own intent ledger).
      - "203.0.113.10"               # peer-server public
      - "100.64.0.11"               # peer-server tailscale

    # Credentials NEVER go in this file. If you keep a dedicated prod
    # connection string in the daemon env, reference it by name here:
    # db_urls:
    #   - "${PROD_DATABASE_URL}"
    db_urls: []

    # buckets:
    #   - "acme-prod-uploads"
    # contexts:                        # k8s contexts, droplet ids, cluster names
    #   - "do-fra1-prod"

  # Staging is declared but intentionally NOT referenced by any catalog rule,
  # so it is inert by default. Add rules with `target_in: staging` if you want
  # a lighter touch (e.g. warn) on these.
  staging:
    resolve_env: true
    hosts:
      - "v2.initech.example.com"                    # Initech V2 staging
      - "admin.globex.example.com"          # Globex V2 staging
    db_urls: []

# Production-only rules beyond the catalog:
rules: []
